/* ================= INÍCIO ================= */
function tile(rotulo, valor, desc, cor, icone, alvo){
  return `<div class="tile ${alvo?'clic':''}" ${alvo?`data-ir="${alvo}"`:''}><div class="ic" style="background:color-mix(in srgb, ${cor} 16%, transparent);color:${cor}">${svg(icone)}</div><div style="min-width:0"><div class="v">${valor}</div><div class="r">${rotulo}</div><div class="d">${desc}</div></div></div>`;
}
function linhaMeta(a){
  const c = calc(a);
  return `<div class="lista-item" data-abrir="${a.id}"><div style="flex:1;min-width:0"><div class="tit trunc">${esc(a.titulo)}</div><div class="linha-flex" style="margin-top:6px">${progHtml(c,'flex:1')}<span class="peq" style="width:38px;text-align:right;font-weight:650">${fmtPct(c.pct)}</span></div></div>${pillSt(c.status)}</div>`;
}
function linhaTarefa(t){
  const a = atividade(t.atividadeId), atrasada = t.prazo && t.prazo < HOJE && t.status!=='feito', col = COLUNAS.find(c=>c[0]===t.status);
  return `<div class="lista-item" data-tarefa="${t.id}"><span style="width:10px;height:10px;border-radius:3px;background:${col[3]};flex:0 0 10px" title="${col[1]}"></span><div style="flex:1;min-width:0"><div class="tit trunc">${esc(t.titulo)}</div><div class="muted peq trunc">${col[1]}${a?' · '+esc(a.titulo):''}</div></div>${t.prazo?`<span class="peq" style="white-space:nowrap;color:${atrasada?'var(--perigo)':'var(--txt-3)'}">${atrasada?'venceu ':''}${quando(t.prazo)}</span>`:''}</div>`;
}
function cartaoAssistente(lista){
  const riscos = planejadas(lista).map(a=>({a, d:inferir(a)})).filter(x=>['critico','alto','medio'].includes(x.d.nivel)).sort((p,q)=>q.d.pontos-p.d.pontos);
  return `<div class="card"><div class="cab"><span class="robo">${svg(ICO.cerebro)}</span><div><h3>Assistente</h3><div class="desc">Atividades com risco de não cumprir a meta</div></div></div><div class="corpo" style="padding-top:4px;padding-bottom:4px">
    ${riscos.length ? riscos.slice(0,5).map(({a,d})=>`<div class="lista-item" data-abrir="${a.id}" data-aba="assistente"><div style="flex:1;min-width:0"><div class="tit trunc">${esc(a.titulo)}</div><div class="muted peq trunc">${esc(d.fatores[0]?.[1]||'')}</div></div><span class="diag ${d.nivel}" style="border:0;padding:0"><span class="nivel">${NIVEL_NOME[d.nivel]}</span></span></div>`).join('') + `<div class="muted peq" style="padding:10px 0">Abra uma atividade e vá em <b>Assistente</b> para ver o diagnóstico e as tarefas sugeridas.</div>` : '<div class="vazio">Nenhuma atividade em risco. Bom trabalho!</div>'}
  </div></div>`;
}
function vInicio(){
  const g = ehGestor(), u = eu(), als = alertas();
  if (!g){
    const minhas = planejadas(visAtividades()), ag = agregados(visAtividades());
    const tarefas = visTarefas().filter(t=>t.status!=='feito').sort((a,b)=>(a.prazo||'9').localeCompare(b.prazo||'9'));
    const prox = S.agenda.filter(e=>e.data>=HOJE).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora)).slice(0,3);
    return `
    <h2 class="saudacao">Olá, ${esc(u.nome.split(' ')[0])}!</h2><p>Hoje é ${DSEM[pd(HOJE).getDay()]}, ${fmtD(HOJE)}. Você tem ${minhas.length} atividades planejadas, ${ag.extras} realizadas fora do planejamento e ${tarefas.length} tarefas abertas.</p>
    <div class="acoes">
      <button class="acao" id="acProgresso"><span class="ic">${svg(ICO.check)}</span><span><b>Atualizar progresso</b><span>Marcar quanto da meta foi feito</span></span></button>
      <button class="acao" id="acTarefa"><span class="ic">${svg(ICO.quadro)}</span><span><b>Nova tarefa</b><span>Anotar algo a fazer no quadro</span></span></button>
      <button class="acao" id="acExtra"><span class="ic">${svg(ICO.estrela)}</span><span><b>Registrar atividade realizada</b><span>Algo feito fora do planejamento</span></span></button>
    </div>
    <div class="grade g-inicio">
      <div class="grade" style="align-content:start">
        <div class="card"><div class="cab"><h3>Precisa da sua atenção</h3><div class="esp"></div>${als.length?`<button class="btn peq fant" data-ir="alertas">Ver todos (${als.length})</button>`:''}</div><div class="corpo">${als.length?als.slice(0,4).map(alertaHtml).join(''):'<div class="vazio">Tudo em dia. Nenhum alerta para você.</div>'}</div></div>
        ${cartaoAssistente(visAtividades())}
        <div class="card"><div class="cab"><h3>Minhas tarefas abertas</h3><div class="esp"></div><button class="btn peq fant" data-ir="quadro">Abrir quadro</button></div><div class="corpo" style="padding-top:4px;padding-bottom:4px">${tarefas.length?tarefas.slice(0,6).map(linhaTarefa).join(''):'<div class="vazio">Nenhuma tarefa aberta.</div>'}</div></div>
      </div>
      <div class="grade" style="align-content:start">
        <div class="card"><div class="cab"><h3>Próximos compromissos do Centro</h3><div class="esp"></div><button class="btn peq fant" data-ir="agenda">Agenda</button></div><div class="corpo" style="padding-top:4px;padding-bottom:4px">${prox.length?prox.map(e=>`<div class="lista-item" data-evento="${e.id}"><div style="width:46px;text-align:center"><b style="font-size:16px">${pd(e.data).getDate()}</b><div class="muted peq" style="text-transform:uppercase">${MESES[pd(e.data).getMonth()]}</div></div><div style="flex:1;min-width:0"><div class="tit trunc">${esc(e.titulo)}</div><div class="muted peq trunc">${esc(e.hora||'')} ${e.local?'· '+esc(e.local):''}</div></div></div>`).join(''):'<div class="vazio">Nenhum compromisso agendado.</div>'}</div></div>
        <div class="card"><div class="cab"><h3>Minhas atividades</h3><span class="desc">· ${fmtPct(ag.media)} de atingimento médio</span><div class="esp"></div><button class="btn peq fant" data-ir="atividades">Ver todas</button></div><div class="corpo" style="padding-top:4px;padding-bottom:4px">${minhas.length?minhas.map(linhaMeta).join(''):'<div class="vazio">Você ainda não tem atividades cadastradas.</div>'}</div></div>
      </div>
    </div>`;
  }
  const ag = agregados(S.atividades), recs = recPendentes(S.atividades);
  const equipe = S.usuarios.map(x=>({u:x, g:agregados(S.atividades.filter(a=>a.respId===x.id)), t:S.tarefas.filter(t=>t.respId===x.id&&t.status!=='feito').length})).filter(x=>x.g.n||x.g.extras);
  return `${ONLINE && !S.atividades.length ? cardImportar() : ''}
  <div class="tiles">
    ${tile('Atingimento médio', fmtPct(ag.media), `${ag.atingidas} de ${ag.n} metas já atingidas`, 'var(--primaria)', ICO.atividades, 'indicadores')}
    ${tile('Atrasadas', ag.atrasadas, 'prazo encerrado sem a meta', 'var(--perigo-cor)', ICO.alertas, 'alertas')}
    ${tile('Prazo próximo / ritmo', ag.proximo + ag.ritmo, `${ag.proximo} vencendo · ${ag.ritmo} abaixo do ritmo`, 'var(--atencao-cor)', ICO.relogio, 'alertas')}
    ${tile('Recursos a providenciar', recs.length, fmtR(recs.reduce((s,x)=>s+Number(x.r.custo||0),0))+' estimados', 'var(--ok)', ICO.caixa, 'recursos')}
  </div>
  <div class="grade g-inicio">
    <div class="grade" style="align-content:start">
      <div class="card"><div class="cab"><h3>Precisa da sua atenção</h3><div class="esp"></div><button class="btn peq fant" data-ir="alertas">Ver todos (${als.length})</button></div><div class="corpo">${als.length?als.filter(a=>a.sev!=='baixa').slice(0,5).map(alertaHtml).join(''):'<div class="vazio">Nenhum alerta.</div>'}</div></div>
      ${cartaoAssistente(S.atividades)}
    </div>
    <div class="grade" style="align-content:start">
      <div class="card"><div class="cab"><h3>Equipe</h3><span class="desc">· atingimento das metas planejadas</span><div class="esp"></div><button class="btn peq fant" data-ir="indicadores">Indicadores</button></div><div class="corpo" style="padding-top:4px;padding-bottom:4px">
        ${equipe.map(x=>`<div class="lista-item" data-filtrar-resp="${x.u.id}">${avatar(x.u,36)}<div style="flex:1;min-width:0"><div class="linha-flex"><span class="tit trunc" style="flex:1">${esc(x.u.nome)}</span><b class="peq">${fmtPct(x.g.media)}</b></div>
          <div class="prog" style="margin:6px 0 4px"><b style="width:${(x.g.media||0)*100}%;background:${x.u.cor}"></b></div>
          <div class="muted peq">${x.g.n} metas · ${x.g.entregas} entregas${x.g.extras?` (${x.g.extras} extra)`:''} · ${x.t} tarefas abertas${x.g.atrasadas?` · <span style="color:var(--perigo)">${x.g.atrasadas} atrasada(s)</span>`:''}</div></div></div>`).join('')}
      </div></div>
      <div class="card"><div class="cab"><h3>Recursos a providenciar</h3><div class="esp"></div><button class="btn peq fant" data-ir="recursos">Ver todos (${recs.length})</button></div><div class="corpo" style="padding-top:4px;padding-bottom:4px">
        ${recs.sort((p,q)=>(p.r.prazo||'9').localeCompare(q.r.prazo||'9')).slice(0,4).map(({a,r})=>`<div class="lista-item" data-abrir="${a.id}" data-aba="recursos"><div style="flex:1;min-width:0"><div class="tit trunc">${esc(r.descricao)}</div><div class="muted peq trunc">${esc(usuario(a.respId).nome)} · ${esc(a.titulo)}</div></div><span class="peq" style="white-space:nowrap;color:${r.prazo&&r.prazo<HOJE?'var(--perigo)':'var(--txt-3)'}">${r.prazo?'até '+fmtDc(r.prazo):''}</span></div>`).join('')||'<div class="vazio">Nada pendente.</div>'}
      </div></div>
    </div>
  </div>`;
}

/* ================= QUADRO ================= */
function tarefasFiltradas(){
  return visTarefas().filter(t=>{
    if (ehGestor() && UI.qResp && t.respId!==UI.qResp) return false;
    if (UI.qAtv && t.atividadeId!==UI.qAtv) return false;
    return true;
  });
}
function cartaoTarefa(t){
  const a = atividade(t.atividadeId), atrasada = t.prazo && t.prazo < HOJE && t.status!=='feito', pode = podeTarefa(t);
  return `<div class="tarefa" data-tarefa="${t.id}" draggable="${pode}">
    ${t.sugerida?'<div class="sug">✦ Sugerida pelo assistente</div>':''}
    <div class="linha-flex" style="align-items:flex-start"><div class="tt" style="flex:1">${esc(t.titulo)}</div><span class="prio ${t.prioridade}">${PRIO[t.prioridade]}</span></div>
    ${a?`<div class="ta trunc">${svg(ICO.atividades).replace('<svg','<svg style="width:12px;height:12px;vertical-align:-2px;margin-right:4px"')}${esc(a.titulo)}</div>`:''}
    ${t.status==='aguardando'&&t.motivo?`<div class="motivo">⏳ ${esc(t.motivo)}</div>`:''}
    <div class="tr">${ehGestor()?avatar(usuario(t.respId),22)+`<span class="peq trunc" style="flex:1">${esc(usuario(t.respId).nome)}</span>`:'<span style="flex:1"></span>'}${t.prazo?`<span class="peq" style="white-space:nowrap;color:${atrasada?'var(--perigo)':'var(--txt-3)'};font-weight:${atrasada?650:400}">${t.status==='feito'?'✓ '+fmtDc(t.concluidaEm||t.prazo):(atrasada?'⚠ ':'')+fmtDc(t.prazo)}</span>`:''}</div>
  </div>`;
}
function vQuadro(){
  const lista = tarefasFiltradas();
  return `
  <div class="filtros">
    ${ehGestor()?`<select id="qResp"><option value="">Toda a equipe</option>${S.usuarios.map(u=>`<option value="${u.id}" ${UI.qResp===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select>`:''}
    <select id="qAtv" style="max-width:340px"><option value="">Todas as atividades</option>${visAtividades().filter(a=>S.tarefas.some(t=>t.atividadeId===a.id)).map(a=>`<option value="${a.id}" ${UI.qAtv===a.id?'selected':''}>${esc(a.titulo.slice(0,60))}</option>`).join('')}</select>
    <div style="flex:1"></div><span class="muted peq">${lista.filter(t=>t.status!=='feito').length} abertas · ${lista.filter(t=>t.status==='feito').length} feitas</span>
  </div>
  <div class="quadro">
    ${COLUNAS.map(([k,n,d,cor])=>{ let itens = lista.filter(t=>t.status===k);
      itens.sort((a,b)=> k==='feito' ? (b.concluidaEm||'').localeCompare(a.concluidaEm||'') : (a.prazo||'9').localeCompare(b.prazo||'9'));
      const total = itens.length, ocultas = k==='feito' && total>8 ? total-8 : 0; if (ocultas) itens = itens.slice(0,8);
      return `<div class="coluna" data-coluna="${k}"><div class="ccab"><i style="background:${cor}"></i><b>${n}</b><span class="n">${total}</span></div><div class="cdesc">${d}</div>
      <div class="ccorpo">${itens.map(cartaoTarefa).join('')}${ocultas?`<div class="muted peq" style="text-align:center">+${ocultas} tarefas feitas mais antigas</div>`:''}${k!=='feito'?`<button class="addcol" data-novatarefa="${k}">+ Adicionar tarefa</button>`:''}</div></div>`; }).join('')}
  </div>`;
}
function ligarArrastar(){
  $$('.tarefa[draggable=true]').forEach(c=>{
    c.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', c.dataset.tarefa); c.classList.add('arrastando'); });
    c.addEventListener('dragend', ()=>c.classList.remove('arrastando'));
  });
  $$('.coluna').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('alvo'); });
    col.addEventListener('dragleave', e=>{ if (!col.contains(e.relatedTarget)) col.classList.remove('alvo'); });
    col.addEventListener('drop', e=>{ e.preventDefault(); col.classList.remove('alvo'); moverTarefa(e.dataTransfer.getData('text/plain'), col.dataset.coluna); });
  });
}
function moverTarefa(id, status){
  const t = S.tarefas.find(x=>x.id===id); if (!t || t.status===status) return;
  if (!podeTarefa(t)) { toast('Você só pode mover as suas tarefas.'); return; }
  t.status = status; t.concluidaEm = status==='feito' ? HOJE : '';
  salvar(); render();
  if (status==='aguardando' && !t.motivo) { abrirTarefa(t.id, true); toast('Diga o que está faltando para continuar.'); }
  else toast(`Movida para “${COLUNAS.find(c=>c[0]===status)[1]}”.`);
}

/* ================= ATIVIDADES (com meta) ================= */
function vAtividades(){
  const g = ehGestor();
  const base = visAtividades().filter(a=>!g || !UI.fResp || a.respId===UI.fResp);
  const b = norm(UI.fBusca.trim());
  const plan = planejadas(base), ext = extras(base);
  const filtra = l => l.filter(a=>{ const c = calc(a);
    if (UI.fStatus==='atencao' && !['atrasada','proximo'].includes(c.status) && !c.abaixoRitmo) return false;
    if (UI.fStatus && !['atencao','extra'].includes(UI.fStatus) && c.status!==UI.fStatus) return false;
    if (UI.fStatus==='extra') return false;
    if (b && !norm(a.titulo+' '+a.kpi).includes(b)) return false; return true; });
  const lista = filtra(plan);
  const extrasVis = (!UI.fStatus || UI.fStatus==='extra') ? ext.filter(a=>!b || norm(a.titulo).includes(b)) : [];
  const cont = k => plan.filter(a=>{ const c = calc(a); return k==='atencao' ? (['atrasada','proximo'].includes(c.status)||c.abaixoRitmo) : c.status===k; }).length;
  const chipsSt = [['','Todas',plan.length+ext.length],['atencao','Precisam de atenção',cont('atencao')],['andamento','Em andamento',cont('andamento')],['concluida','Concluídas',cont('concluida')],['atrasada','Atrasadas',cont('atrasada')],['extra','Fora do planejamento',ext.length]];
  const linha = a => { const c = calc(a), pode = podeEditar(a), pts = usaPontos(a) && Number(a.meta)<=15;
    return `<div class="atv"><div class="abre" data-abrir="${a.id}"><div class="tit">${a.naAgendaGoogle?'<span title="Importante: está na Google Agenda">⭐ </span>':''}${esc(a.titulo)}</div><div class="sub">${esc(a.kpi)} · até ${fmtD(a.fim)}</div>${a.funcoes?.length?`<div class="funcs">${chipsFuncoes(a.funcoes,2)}</div>`:''}</div>
      <div><div class="num"><span><b>${realizadoTxt(a,c)}</b> · ${fmtPct(c.pct)}</span>${pode&&!pts?`<button class="btn-prog" data-progresso="${a.id}">Atualizar</button>`:''}</div>${pts ? pontosHtml(a, false, !pode) : progHtml(c)}</div>
      <div>${pillSt(c.status)}</div></div>`; };
  const grupos = g ? S.usuarios.map(u=>({u, itens:lista.filter(a=>a.respId===u.id)})).filter(x=>x.itens.length) : [{u:eu(), itens:lista}];
  return `
  <div class="filtros">
    ${g?`<select id="fResp"><option value="">Toda a equipe</option>${S.usuarios.filter(u=>S.atividades.some(a=>a.respId===u.id)).map(u=>`<option value="${u.id}" ${UI.fResp===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select>`:''}
    <input type="search" id="fBusca" placeholder="Buscar…" value="${esc(UI.fBusca)}" style="min-width:220px">
    <div style="flex:1"></div>
    <button class="btn" id="acExtra">${svg(ICO.estrela)}Registrar atividade realizada</button>
  </div>
  <div class="chips" style="margin-bottom:16px">${chipsSt.map(([k,n,c])=>`<button class="chip ${UI.fStatus===k?'ativo':''}" data-fstatus="${k}">${n}<span class="n">${c}</span></button>`).join('')}</div>
  ${lista.length ? grupos.map(gr=>`<div class="card" style="margin-bottom:16px">${g?`<div class="cab">${avatar(gr.u,30)}<h3>${esc(gr.u.nome)}</h3><div class="esp"></div><span class="muted peq">${gr.itens.length} atividade(s)</span></div>`:`<div class="cab"><h3>Atividades planejadas</h3><span class="desc">· clique nos pontos para marcar quantas já foram feitas</span></div>`}${gr.itens.map(linha).join('')}</div>`).join('') : (UI.fStatus!=='extra'?`<div class="card" style="margin-bottom:16px"><div class="vazio">Nenhuma atividade planejada encontrada.<br><br><button class="btn prim" id="acAtividade">Cadastrar atividade</button></div></div>`:'')}
  ${extrasVis.length || UI.fStatus==='extra' ? `<div class="card"><div class="cab"><span class="robo" style="background:var(--gelo);color:#1D5671">${svg(ICO.estrela)}</span><div><h3>Realizadas fora do planejamento</h3><div class="desc">Atividades concluídas que não estavam previstas — contam como entregas no desempenho</div></div></div>
    ${extrasVis.map(a=>`<div class="atv"><div class="abre" data-abrir="${a.id}"><div class="tit">${esc(a.titulo)}</div><div class="sub">${fmtD(a.fim)}${g?' · '+esc(usuario(a.respId).nome):''}${a.descricao?' · '+esc(a.descricao.slice(0,90)):''}</div>${a.funcoes?.length?`<div class="funcs">${chipsFuncoes(a.funcoes,2)}</div>`:''}</div><div class="peq"><b>${fmtN(realizadoDe(a),1)}</b> ${esc(a.kpi)}</div><div>${pillSt('extra')}</div></div>`).join('') || '<div class="vazio">Nenhuma registrada.</div>'}</div>` : ''}
  <p class="muted peq">Nas atividades com até 15 itens de meta, cada ponto é uma unidade: clique no ponto correspondente ao total já feito. Nas demais, use “Atualizar” para arrastar a barra. O traço fino na barra indica onde a meta deveria estar hoje.</p>`;
}

/* ================= DETALHE DA ATIVIDADE ================= */
let ED = null, edAba = 'resumo', edSujo = false, NV = null, SUG = null;
function abrirAtividade(id, aba){
  const a = atividade(id); if (!a) return;
  if (!ehGestor() && !meu(a)) { toast('Esta atividade não é sua.'); return; }
  ED = JSON.parse(JSON.stringify(a)); edAba = aba || 'resumo'; edSujo = false; NV = null; SUG = null;
  $('#modal').className = 'modal'; desenharEditor(); $('#fundo').classList.add('aberto');
}
function mesesDoIntervalo(i, f){ const a=pd(i), b=pd(f), ano=S.config.ano, out=[]; for(let m=1;m<=12;m++){ if (new Date(ano,m,0)>=a && new Date(ano,m-1,1)<=b) out.push(m);} return out; }
function controleProgresso(a){
  if (!podeEditar(a)) return '';
  const c = calc(a), atual = c.realizado||0, meta = Number(a.meta);
  const max = a.unidade==='%' ? 100 : Math.max(meta, Math.ceil(atual), 1) * (usaPontos(a)?1:1.2);
  return `<div class="bloco-prog"><h4>Atualizar progresso</h4><p class="dica" style="margin-bottom:12px">${usaPontos(a)?`Clique no ponto que corresponde ao total já feito (cada ponto = 1 de ${fmtN(meta)}). O círculo tracejado zera.`:'Arraste a barra até o valor alcançado e salve.'}</p>
    ${usaPontos(a) ? pontosHtml(a, true) : `<div class="slider-box"><input type="range" id="rgProg" min="0" max="${Math.round(max)}" step="${a.unidade==='%'?5:(meta>200?5:1)}" value="${Math.min(atual, max)}"><output id="rgOut">${fmtN(atual,1)}${unid(a)}</output><button class="btn prim peq" id="rgSalvar" data-id="${a.id}">Salvar</button></div><div class="muted peq" style="margin-top:4px">Meta: ${fmtN(meta,1)}${unid(a)}</div>`}
  </div>`;
}
function camposDados(a, dis){
  return `
    <div class="form">
      <label class="campo s6"><span>Nome da atividade</span><input type="text" data-k="titulo" value="${esc(a.titulo)}" ${dis}></label>
      <label class="campo s3"><span>Responsável</span><select data-k="respId" ${ehGestor()?dis:'disabled'}>${S.usuarios.map(u=>`<option value="${u.id}" ${a.respId===u.id?'selected':''}>${esc(u.nome)}</option>`).join('')}</select></label>

function lerCamposEditor(){

  if ($('#modal [data-func]')) ED.funcoes = $$('#modal [data-func]').filter(x=>x.checked).map(x=>x.dataset.func);
  $$('#modal tr[data-m]').forEach(tr=>{ const m = ED.marcos.find(x=>x.id===tr.dataset.m); $$('[data-mk]',tr).forEach(el=>{ m[el.dataset.mk] = el.type==='checkbox' ? el.checked : el.value; }); });
  $$('#modal [data-r]').forEach(div=>{ const r = ED.recursos.find(x=>x.id===div.dataset.r); $$('[data-rk]',div).forEach(el=>{ r[el.dataset.rk] = el.type==='number' ? Number(el.value||0) : el.value; }); });

function salvarAtividade(){
  lerCamposEditor();
  if (!ED.titulo.trim()) { edAba='dados'; desenharEditor(); toast('Informe o nome da atividade.'); return; }
  if (ED.planejada===false){ ED.inicio = ED.fim; ED.meses = [pd(ED.fim).getMonth()+1]; const atual = atividade(ED.id); const l = atual.lancamentos[0]; if (l){ l.valor = Number(ED.meta); l.data = ED.fim; l.descricao = ED.descricao || l.descricao; } ED.lancamentos = atual.lancamentos; }
  else {
    if (!String(ED.kpi||'').trim()) { toast('Diga o que será medido.'); return; }
    if (!ED.inicio || !ED.fim || ED.fim < ED.inicio) { toast('O prazo final deve ser depois do início.'); return; }
    if (ED.recursos.some(r=>!r.descricao.trim())) { toast('Descreva cada recurso ou remova o pedido vazio.'); return; }
    const dentro = mesesDoIntervalo(ED.inicio, ED.fim); ED.meses = ED.meses.filter(m=>dentro.includes(m)); if (!ED.meses.length) ED.meses = dentro;
    ED.lancamentos = atividade(ED.id).lancamentos;
  }
  ED.atualizadoEm = new Date().toISOString();
  S.atividades[S.atividades.findIndex(x=>x.id===ED.id)] = ED;
  salvar(); edSujo = false; const id = ED.id, aba = edAba; render(); abrirAtividade(id, aba==='dados'?'resumo':aba); toast('Alterações salvas.');
}

function lerNova(){
  const a = NV.a;
  $$('#modal [data-n]').forEach(el=>{ a[el.dataset.n] = el.type==='checkbox' ? el.checked : el.value; });
  if ($('#modal [data-nmes]')) a.meses = $$('#modal [data-nmes]').filter(x=>x.checked).map(x=>Number(x.dataset.nmes));
  if ($('#modal [data-nfunc]')) a.funcoes = $$('#modal [data-nfunc]').filter(x=>x.checked).map(x=>x.dataset.nfunc);
}
function validarPasso(){
  const a = NV.a, p = NV.passo;
  if (p===1){ if (!a.titulo.trim()) return 'Informe o nome da atividade.'; if (!a.respId) return 'Escolha o responsável.'; if (!a.eixo) return 'Escolha o eixo estratégico.'; }
  if (p===3){ if (!a.inicio || !a.fim || a.fim < a.inicio) return 'O prazo final deve ser depois do início.'; }
  if (p===4){ if (!a.kpi.trim()) return 'Diga o que será contado.'; if (a.meta==='' || Number(a.meta)<=0) return 'Informe a meta (um número maior que zero).'; }
  return '';
}

function reduzirImagem(file, lado, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = lado; const ctx = c.getContext('2d');
    const m = Math.min(img.width, img.height); ctx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, lado, lado);
    cb(c.toDataURL('image/jpeg', .85)); }; img.onerror = () => toast('Não foi possível ler a imagem.'); img.src = r.result; };
  r.readAsDataURL(file);
}

function fimHora(h){ const [H,M] = h.split(':').map(Number); return H>=23 ? '23:59' : `${pad(H+1)}:${pad(M)}`; }
function gcalLink(e){
  const d8 = s => s.replace(/-/g,''), g = gcfg();
  const dates = e.hora ? `${d8(e.data)}T${e.hora.replace(':','')}00/${d8(e.data)}T${(e.horaFim||fimHora(e.hora)).replace(':','')}00` : `${d8(e.data)}/${d8(iso(addDias(pd(e.data),1)))}`;
  const p = new URLSearchParams({action:'TEMPLATE', text:e.titulo, dates, ctz:'America/Sao_Paulo', details:(e.descricao?e.descricao+'\n\n':'')+'Agenda do '+S.config.nomeCentro, location:e.local||''});
  if (g.calId) p.set('src', g.calId);
  if (g.email) p.set('authuser', g.email);

}
const gcalAbrir = () => { const g = gcfg(); return 'https://calendar.google.com/calendar/r' + (g.email ? '?authuser=' + encodeURIComponent(g.email) : ''); };
const gcalEmbed = () => { const g = gcfg(); return 'https://calendar.google.com/calendar/embed?src=' + encodeURIComponent(g.calId || g.email) + '&ctz=America%2FSao_Paulo&mode=MONTH&hl=pt_BR&showPrint=0'; };
function icsEsc(v){ return String(v||'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;'); }
function icsDobra(l){ const out = []; while (l.length > 74){ out.push(l.slice(0,74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); }
function gerarICS(comFeriados, comPrazos){
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Centro de Inovacao//Gestao de Atividades//PT-BR','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:'+icsEsc(S.config.nomeCentro),'X-WR-TIMEZONE:America/Sao_Paulo',
    'BEGIN:VTIMEZONE','TZID:America/Sao_Paulo','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:-0300','TZOFFSETTO:-0300','TZNAME:-03','END:STANDARD','END:VTIMEZONE'];
  const st = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'), d8 = x => x.replace(/-/g,'');
  const diaInteiro = (u, data, titulo, desc, livre) => { L.push('BEGIN:VEVENT','UID:'+u+'@centro-inovacao','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+d8(data),'DTEND;VALUE=DATE:'+d8(iso(addDias(pd(data),1))),'SUMMARY:'+icsEsc(titulo)); if (desc) L.push('DESCRIPTION:'+icsEsc(desc)); if (livre) L.push('TRANSP:TRANSPARENT'); L.push('END:VEVENT'); };
  S.agenda.forEach(e=>{
    if (!e.hora) return diaInteiro('ci-'+e.id, e.data, e.titulo, e.descricao);
    L.push('BEGIN:VEVENT','UID:ci-'+e.id+'@centro-inovacao','DTSTAMP:'+st,'DTSTART;TZID=America/Sao_Paulo:'+d8(e.data)+'T'+e.hora.replace(':','')+'00','DTEND;TZID=America/Sao_Paulo:'+d8(e.data)+'T'+(e.horaFim||fimHora(e.hora)).replace(':','')+'00','SUMMARY:'+icsEsc(e.titulo));
    if (e.local) L.push('LOCATION:'+icsEsc(e.local)); if (e.descricao) L.push('DESCRIPTION:'+icsEsc(e.descricao)); L.push('END:VEVENT');
  });
  if (comFeriados) S.feriados.forEach(f=>diaInteiro('fer-'+f.data, f.data, f.nome, f.tipo, true));
  if (comPrazos) planejadas(visAtividades()).forEach(a=>{
    diaInteiro('prazo-'+a.id, a.fim, 'Prazo: '+a.titulo, `${a.kpi} — meta ${fmtN(a.meta,1)}${unid(a)} · ${usuario(a.respId).nome}`, true);
    (a.marcos||[]).forEach(m=>{ if (!m.feito) diaInteiro('etapa-'+m.id, m.data, m.titulo+' — '+a.titulo, usuario(a.respId).nome, true); });
  });
  L.push('END:VCALENDAR');
  return L.map(icsDobra).join('\r\n') + '\r\n';
}

function eventosDia(s){
  const ev = [], g = ehGestor();
  const f = feriadoEm(s); if (f) ev.push({cls:'feriado', t:f.nome, sub:f.tipo});
  S.agenda.filter(e=>e.data===s).sort((a,b)=>(a.hora||'').localeCompare(b.hora||'')).forEach(e=>ev.push({cls:'evento', t:(e.hora?e.hora+' ':'')+e.titulo, sub:e.local||'Agenda do Centro', evento:e}));
  if (UI.calMeus){
    const lista = g ? S.atividades : S.atividades.filter(meu);
    lista.forEach(a=>{
      if (a.planejada===false){ if (a.fim===s) ev.push({cls:'extra', t:'Realizada: '+a.titulo, a}); return; }
      if (a.inicio===s) ev.push({cls:'inicio', t:'Início: '+a.titulo, a});
      if (a.fim===s) ev.push({cls:'prazo', t:'Prazo: '+a.titulo, a});
      (a.marcos||[]).forEach(m=>{ if (m.data===s) ev.push({cls:'marco'+(m.feito?' feito':''), t:m.titulo+' — '+a.titulo, a}); });
      (a.recursos||[]).forEach(r=>{ if (r.prazo===s && (r.status==='solicitado'||r.status==='providencia')) ev.push({cls:'recurso', t:'Recurso: '+r.descricao, a}); });
    });
    visTarefas().forEach(t=>{ if (t.prazo===s) ev.push({cls:'tarefa'+(t.status==='feito'?' feito':''), t:'Tarefa: '+t.titulo, tarefa:t}); });
  }
  return ev;
}

function vGantt(){
  const z = UI.ganttZoom, ano = S.config.ano, i0 = `${ano}-01-01`, nDias = difDias(i0, `${ano}-12-31`)+1, W = nDias*z, LBL = innerWidth<900?190:320, g = ehGestor();

  const lista = planejadas(visAtividades()).filter(a=>!g || !UI.ganttResp || a.respId===UI.ganttResp);
  const grupo = g ? UI.ganttGrupo : (UI.ganttGrupo==='resp'?'eixo':UI.ganttGrupo);
  const chave = grupo==='resp' ? (a=>usuario(a.respId).nome) : grupo==='eixo' ? (a=>a.eixo||'Sem eixo') : (a=>ST_NOME[calc(a).status]);
  const ordem = grupo==='resp' ? S.usuarios.map(u=>u.nome) : grupo==='eixo' ? [...EIXOS,'Sem eixo'] : Object.values(ST_NOME);
  const grupos = ordem.map(n=>({n, itens:lista.filter(a=>chave(a)===n).sort((p,q)=>p.inicio.localeCompare(q.inicio))})).filter(x=>x.itens.length);
  const grade = MESES.map((n,i)=>`<div class="g-grade" style="left:${x(`${ano}-${pad(i+1)}-01`)}px"></div>`).join('');
  const meses = MESES.map((n,i)=>`<div class="g-mes" style="left:${x(`${ano}-${pad(i+1)}-01`)}px;width:${ultimoDia(ano,i+1)*z}px">${z>=3?MESES_L[i].replace(/^./,c=>c.toUpperCase()):n}</div>`).join('');
  const temHoje = HOJE.startsWith(ano);
  const linhas = grupos.map(gr=>`<div class="g-row grupo"><div class="g-lbl">${grupo==='resp'?avatar(S.usuarios.find(u=>u.nome===gr.n)||{},22):''}<span class="t">${esc(gr.n)}</span><span class="muted peq">${gr.itens.length}</span></div><div class="g-trk" style="width:${W}px">${grade}</div></div>` +
    gr.itens.map(a=>{
      const c = calc(a), cor = ST_COR[c.status], segs = segmentos(a), tot = segs.reduce((s,[i,f])=>s+difDias(i,f)+1,0); let resta = Math.min(1,c.pct)*tot;
      const barras = segs.map(([i,f])=>{ const len = difDias(i,f)+1, fill = Math.max(0,Math.min(len,resta)); resta -= fill;
        return `<div class="g-seg" data-abrir="${a.id}" style="left:${x(i)}px;width:${Math.max(3,len*z)}px;background:color-mix(in srgb, ${cor} 28%, transparent)" title="${esc(a.titulo)} · ${fmtD(i)} a ${fmtD(f)} · ${fmtPct(c.pct)}"><b style="width:${fill/len*100}%;background:${cor}"></b></div>`; }).join('');
      const marcos = (a.marcos||[]).filter(m=>m.data.startsWith(ano)).map(m=>`<div class="g-marco" data-abrir="${a.id}" style="left:${x(m.data)+z/2-6}px;background:${m.feito?'var(--ok)':(m.data<HOJE?'var(--perigo-cor)':'var(--navy)')}" title="${esc(m.titulo)} · ${fmtD(m.data)}"></div>`).join('');
      return `<div class="g-row"><div class="g-lbl" data-abrir="${a.id}" title="${esc(a.titulo)}"><span style="width:8px;height:8px;border-radius:50%;background:${cor};flex:0 0 8px"></span><span class="t">${esc(a.titulo)}</span></div><div class="g-trk" style="width:${W}px">${grade}${barras}${marcos}<span class="g-pct" style="left:${x(segs[segs.length-1][1])+z+6}px">${fmtPct(c.pct)}</span></div></div>`;
    }).join('')).join('');
  return `

/* ================= INDICADORES / DESEMPENHO ================= */
function usoFuncoes(lista){
  // retorna [{f, s, atividades:[...]}] para cada função/subfunção usada
  const mapa = new Map();
  lista.forEach(a=>(a.funcoes||[]).forEach(id=>{ const r = funcaoDe(id); if (!r) return; if (!mapa.has(id)) mapa.set(id, {...r, id, atividades:[]}); mapa.get(id).atividades.push(a); }));
  const ordem = []; S.funcoes.forEach(f=>{ if (mapa.has(f.id)) ordem.push(mapa.get(f.id)); f.subs.forEach(s=>{ if (mapa.has(s.id)) ordem.push(mapa.get(s.id)); }); });
  return ordem;
}
function tabelaAgreg(rotulo, linhas){
  const row = g => `<td class="num">${g.n}</td><td style="width:24%"><div class="linha-flex"><div class="prog" style="flex:1"><b style="width:${(g.media||0)*100}%"></b></div><b class="peq" style="width:40px;text-align:right">${fmtPct(g.media)}</b></div></td><td class="num">${g.atingidas}</td><td class="num">${g.extras}</td><td class="num"><b>${g.entregas}</b></td><td class="num" style="color:${g.atrasadas?'var(--perigo)':''}">${g.atrasadas}</td>`;
  const tot = agregados(linhas.flatMap(l=>l.lista));
  return `<table class="tabela"><thead><tr><th>${rotulo}</th><th class="num">Planejadas</th><th>Atingimento médio</th><th class="num">Metas atingidas</th><th class="num">Extras</th><th class="num">Entregas</th><th class="num">Atrasadas</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.pre||''}${esc(l.nome)}</td>${row(agregados(l.lista))}</tr>`).join('')}
    ${linhas.length>1?`<tr style="font-weight:700;background:var(--card-2)"><td>Total</td>${row(tot)}</tr>`:''}</tbody></table>`;
}
function painelFuncoes(lista){
  const uso = usoFuncoes(lista);
  if (!uso.length) return '<div class="vazio">Nenhuma atividade ligada a funções do Centro.</div>';
  return `<table class="tabela"><thead><tr><th>Função / subfunção</th><th class="num">Atividades</th><th class="num">Concluídas</th>${ehGestor()?'<th>Pessoas</th>':''}</tr></thead><tbody>${uso.map(u=>{ const conc = u.atividades.filter(a=>['concluida','extra'].includes(calc(a).status)).length; const pessoas = [...new Set(u.atividades.map(a=>a.respId))];
    return `<tr><td>${u.s?`<span class="muted">${esc(fnum(u.f))} ›</span> <b>${esc(u.s.nome)}</b>`:`<b>${esc(fnum(u.f))}</b>`}</td><td class="num">${u.atividades.length}</td><td class="num">${conc}</td>${ehGestor()?`<td><div class="linha-flex">${pessoas.map(p=>`<span title="${esc(usuario(p).nome)}">${avatar(usuario(p),22)}</span>`).join('')}</div></td>`:''}</tr>`; }).join('')}</tbody></table>`;
}

  else corpo = `<table class="tabela"><thead><tr><th>Atividade</th>${g?'<th>Pessoa</th>':''}<th>Meta</th><th class="num">Realizado</th><th style="width:16%">Atingimento</th><th>Situação</th></tr></thead><tbody>
    ${lista.map(a=>{ const c = calc(a); return `<tr class="clic" data-abrir="${a.id}"><td style="font-weight:600">${esc(a.titulo)}</td>${g?`<td class="peq">${esc(usuario(a.respId).nome)}</td>`:''}<td class="peq">${a.planejada===false?'—':esc(a.kpi)+': '+fmtN(a.meta,1)+unid(a)}</td><td class="num">${c.realizado==null?'—':fmtN(c.realizado,1)+unid(a)}</td><td>${a.planejada===false?'':`<div class="linha-flex">${progHtml(c,'flex:1')}<b class="peq" style="width:38px;text-align:right">${fmtPct(c.pct)}</b></div>`}</td><td>${pillSt(c.status)}</td></tr>`; }).join('')}</tbody></table>`;
  return `<div class="chips" style="margin-bottom:16px">${abas.map(([k,n])=>`<button class="chip ${UI.indAba===k?'ativo':''}" data-iaba="${k}">${n}</button>`).join('')}</div>

  if (tipo==='lanc') baixar(nome('progresso'), csv([['Data','Responsável','Atividade','O que é medido','Valor','Descrição','Evidência','Registrado por'], ...at.flatMap(a=>a.lancamentos.map(l=>[fmtD(l.data), usuario(a.respId).nome, a.titulo, a.kpi, num(l.valor), l.descricao, l.evidencia, usuario(l.autor).nome]))]), T);

    usuarios:[], funcoes:[], feriados:[], atividades:[], tarefas:[], agenda:[], sessao:{usuarioId:null}};
}
function carregarOnline(){
  let c = null;
  try { c = JSON.parse(localStorage.getItem(KEY_ON) || 'null'); } catch(e){}
  if (c && c.S && SESS.token){ SYNC.rev = c.rev || 0; SYNC.snap = c.snap || {}; const st = c.S; st.config = {...estadoBaseOnline().config, ...st.config}; return st; }
  const st = estadoBaseOnline();
  try { const t = JSON.parse(localStorage.getItem(KEY_ON+'_tema') || 'null'); if (t) st.config.tema = t; } catch(e){}
  return st;
}
function persistir(){
  try { localStorage.setItem(KEY_ON, JSON.stringify({S, rev:SYNC.rev, snap:SYNC.snap})); localStorage.setItem(KEY_ON+'_tema', JSON.stringify(S.config.tema)); }
  catch(e){ /* sem espaço: os dados continuam no servidor */ }
}
async function api(acao, dados={}){
  const ctrl = new AbortController(), tm = setTimeout(()=>ctrl.abort(), 90000);
  try {
    const r = await fetch(API_URL, {method:'POST', body:JSON.stringify({acao, token:SESS.token, ...dados}), signal:ctrl.signal});
    const j = await r.json();
    if (j && j.erro==='sessao' && acao!=='login' && acao!=='publico'){ encerrarSessao('Sua sessão terminou. Entre novamente.'); throw new Error('sessao'); }
    return j;
  } finally { clearTimeout(tm); }
}
async function carregarPublico(){
  PUB_ESTADO = 'carregando';
  try {
    const r = await api('publico'); if (!r || !r.ok) throw 0;
    PUBLICO = r; PUB_ESTADO = 'ok';
    if (r.config && r.config.nomeCentro) S.config.nomeCentro = r.config.nomeCentro;
    if (r.config && r.config.logo) S.config.logo = r.config.logo;
  } catch(e){ PUB_ESTADO = 'erro'; }
  if (!S.sessao.usuarioId) telaLogin();
}

function encerrarSessao(msg){ limparSessaoLocal(); render(); toast(msg); }

function mapaDe(c){
  if (c==='config'){ const o = {}; Object.keys(S.config).forEach(k=>{ if (!LOCAIS.includes(k)) o[k] = S.config[k]; }); return {geral:o}; }
  const m = {}; (S[c]||[]).forEach(x=>{ m[x.id] = x; }); return m;
}
function podeEnviar(c, id){
  if (ehGestor()) return true;
  if (c==='usuarios') return id===S.sessao.usuarioId;
  return c==='atividades' || c==='tarefas' || c==='agenda';
}
function coletarOps(){
  const ops = [];
  if (!S.sessao.usuarioId) return ops;
  COLS_SYNC.forEach(c=>{
    const atual = mapaDe(c), ant = SYNC.snap[c] || {};
    Object.keys(atual).forEach(id=>{ if (!podeEnviar(c,id)) return; const js = JSON.stringify(atual[id]); if (ant[id]!==js) ops.push({c, id, op:'set', item:atual[id], js}); });
    Object.keys(ant).forEach(id=>{ if (!(id in atual) && podeEnviar(c,id)) ops.push({c, id, op:'del'}); });
  });
  return ops;
}
function agendarEnvio(){ if (!ONLINE || !SESS.token) return; estadoSync('pendente'); clearTimeout(SYNC.timer); SYNC.timer = setTimeout(enviar, 700); }
function aplicarMudancas(mudancas, enviados){
  enviados = enviados || {};
  const mapas = {}; let mudou = false;
  (mudancas||[]).forEach(({c, id, item})=>{
    if (!COLS_SYNC.includes(c)) return;
    const mapa = mapas[c] || (mapas[c] = mapaDe(c));
    const snapC = SYNC.snap[c] || (SYNC.snap[c] = {});
    const k = c + '|' + id, local = mapa[id], localJs = local ? JSON.stringify(local) : undefined;
    let limpo = localJs === snapC[id];
    if (k in enviados) limpo = limpo || localJs === (enviados[k]===null ? undefined : enviados[k]);
    if (item) snapC[id] = JSON.stringify(item); else delete snapC[id];
    if (!limpo) return; // alteração local mais recente: será enviada de novo
    if (c==='config'){ if (item){ const loc = {}; LOCAIS.forEach(x=>{ loc[x] = S.config[x]; }); S.config = {...item, ...loc}; mudou = true; } return; }
    const arr = S[c] || (S[c] = []), i = arr.findIndex(x=>x.id===id);
    if (item){ if (i>=0) arr[i] = item; else arr.push(item); mapa[id] = item; }
    else if (i>=0){ arr.splice(i,1); delete mapa[id]; }
    mudou = true;
  });
  return mudou;
}
function reverterItem(c, id){
  const js = (SYNC.snap[c]||{})[id];
  if (c==='config'){ if (js){ const loc = {}; LOCAIS.forEach(x=>{ loc[x] = S.config[x]; }); S.config = {...JSON.parse(js), ...loc}; } return; }
  const arr = S[c] || [], i = arr.findIndex(x=>x.id===id);
  if (js){ const it = JSON.parse(js); if (i>=0) arr[i] = it; else arr.push(it); } else if (i>=0) arr.splice(i,1);
}
async function enviar(){
  if (!ONLINE || !SESS.token || !S.sessao.usuarioId) return;
  if (SYNC.enviando || SYNC.puxando){ SYNC.pendente = true; return; }
  const ops = coletarOps();
  if (!ops.length){ estadoSync('ok'); return; }
  SYNC.enviando = true; estadoSync('salvando');
  const enviados = {}; ops.forEach(o=>{ enviados[o.c+'|'+o.id] = o.op==='del' ? null : o.js; });
  try {
    const r = await api('gravar', {ops: ops.map(o=>({c:o.c, id:o.id, op:o.op, item:o.item})), desde:SYNC.rev});
    if (!r || !r.ok) throw new Error((r && r.erro) || 'falha');
    const mudou = aplicarMudancas(r.mudancas, enviados);
    (r.rejeitadas||[]).forEach(x=>reverterItem(x.c, x.id));

    if (r.rejeitadas && r.rejeitadas.length) toast('Não foi possível salvar: ' + r.rejeitadas[0].motivo);

  } catch(e){ if (e.message!=='sessao') estadoSync('offline'); }
  finally { SYNC.enviando = false; if (SYNC.pendente){ SYNC.pendente = false; setTimeout(enviar, 300); } }
}
async function puxar(completo, avisar){
  if (!ONLINE || !SESS.token) return;
  if (SYNC.enviando || SYNC.puxando) return;
  SYNC.puxando = true; if (avisar || completo) estadoSync('salvando');
  try {
    const r = await api('sync', {desde: completo ? 0 : SYNC.rev});
    if (!r || !r.ok) throw new Error((r && r.erro) || 'falha');
    if (completo){ COLS_SYNC.forEach(c=>{ if (c!=='config') S[c] = []; }); SYNC.snap = {}; }
    const mudou = aplicarMudancas(r.mudancas);
    SYNC.rev = r.rev;
    if (completo) posCarga();
    persistir();
    const pend = coletarOps().length;
    estadoSync(pend ? 'pendente' : 'ok');
    if (pend) agendarEnvio();
    if (avisar) toast('Sincronizado.');
    if ((mudou || completo) && S.sessao.usuarioId) renderSeguro();
  } catch(e){ if (e.message!=='sessao') estadoSync('offline'); if (completo) throw e; }
  finally { SYNC.puxando = false; if (SYNC.pendente){ SYNC.pendente = false; setTimeout(enviar, 300); } }
}

function reduzirLogo(file, cb){
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
    const lado = 256, esc_ = Math.min(1, lado / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width*esc_); c.height = Math.round(img.height*esc_);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); cb(c.toDataURL('image/png')); };
    img.onerror = () => toast('Não foi possível ler a imagem.'); img.src = r.result; };
  r.readAsDataURL(file);
}

      ED.marcos = JSON.parse(JSON.stringify(a.marcos)); salvar(); render(); edAba = 'etapas'; desenharEditor(); toast(`${n} etapa(s) criada(s).`); return;
    }
    if (id==='salvarAtv') return salvarAtividade();
    if (id==='excluirAtv'){ if (confirm('Excluir esta atividade e seu histórico? As tarefas ligadas ficarão avulsas.')){ S.atividades = S.atividades.filter(a=>a.id!==ED.id); S.tarefas.forEach(x=>{ if (x.atividadeId===ED.id) x.atividadeId=''; }); salvar(); fecharModal(true); render(); toast('Atividade excluída.'); } return; }
    if (id==='addMarco'){ lerCamposEditor(); ED.marcos.push({id:uid(), titulo:'Nova etapa', data: ED.fim < HOJE ? ED.fim : HOJE, feito:false}); edSujo = true; desenharEditor(); return; }
    if (btn?.dataset.delm){ lerCamposEditor(); ED.marcos = ED.marcos.filter(m=>m.id!==btn.dataset.delm); edSujo = true; desenharEditor(); return; }
    if (id==='addRec'){ lerCamposEditor(); ED.recursos.push({id:uid(), descricao:'', tipo:TIPOS_REC[0], qtd:1, custo:0, prazo:'', status:'solicitado', obs:'', criadoEm:HOJE}); edSujo = true; desenharEditor(); setTimeout(()=>{ const ins = $$('#modal [data-rk="descricao"]'); ins[ins.length-1]?.focus(); }, 30); return; }
    if (btn?.dataset.delr){ lerCamposEditor(); ED.recursos = ED.recursos.filter(r=>r.id!==btn.dataset.delr); edSujo = true; desenharEditor(); return; }
    if (btn?.dataset.dell){ if (!confirm('Excluir este registro de progresso?')) return; const a = atividade(ED.id); a.lancamentos = a.lancamentos.filter(l=>l.id!==btn.dataset.dell); ED.lancamentos = a.lancamentos; salvar(); desenharEditor(); render(); return; }
    return;
  }
  // ----- navegação
  const irEl = t.closest('[data-ir]'); if (irEl) return ir(irEl.dataset.ir);
  const nv = t.closest('[data-vista]'); if (nv) return ir(nv.dataset.vista);
  const ab = t.closest('[data-abrir]'); if (ab) { $('#popAlertas').hidden = true; return abrirAtividade(ab.dataset.abrir, ab.dataset.aba); }
  const pf = t.closest('[data-pessoa]'); if (pf) return abrirPessoa(pf.dataset.pessoa);
  const fr = t.closest('[data-filtrar-resp]'); if (fr){ UI.fResp = fr.dataset.filtrarResp; UI.fStatus=''; return ir('atividades'); }
  if (t.closest('#meuPerfil') || t.closest('#fotoSessao')) return abrirPessoa(S.sessao.usuarioId);
  if (id==='btnSair') return sair();
  if (t.closest('#sinc')) { if (coletarOps().length) enviar(); else puxar(false, true); return; }
  if (id==='importarPlanilha') return importarPlanilhaOnline();
  if (id==='btnNova') return vista==='quadro' ? abrirTarefa(null) : vista==='agenda' ? abrirEvento(null, UI.calSel) : novaAtividade();
  if (id==='acProgresso') return abrirProgresso();
  if (id==='acTarefa') return abrirTarefa(null);
  if (id==='acExtra') return abrirExtra();
  if (id==='acAtividade') return novaAtividade();
  if (id==='btnSino') return popAlertas();
  if (id==='btnMenu' || id==='btnMais') return $('#lateral').classList.toggle('aberta');
  if (id==='btnTela' || id==='btnTela2') return alternarTelaCheia();
  if (id==='btnInstalar' || id==='cfInstalar'){ if (promptInstalar){ promptInstalar.prompt(); promptInstalar.userChoice.finally(()=>{ promptInstalar = null; atualizarBotoesApp(); }); } else toast('Use o menu do navegador: Instalar aplicativo / Adicionar à tela inicial.'); return; }
  if (id==='gcalBtn') return abrirGoogle();
  if (btn?.dataset.vergoogle){ UI.verGoogle = btn.dataset.vergoogle==='1'; render(); return; }
  if (id==='btnAjuda'){ if (S.config.ajudaOculta[vista]) { ajudaForcada = !ajudaForcada; } else { S.config.ajudaOculta[vista] = true; salvar(); } render(); return; }
  if (id==='ocultarAjuda'){ S.config.ajudaOculta[vista] = true; ajudaForcada = false; salvar(); render(); return; }
  if (id==='btnTema'){ S.config.tema = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark'; salvar(); aplicarTema(); return; }
  if (btn?.dataset.fstatus!==undefined){ UI.fStatus = btn.dataset.fstatus; render(); return; }
  if (btn?.dataset.ggrupo){ UI.ganttGrupo = btn.dataset.ggrupo; render(); return; }
  if (btn?.dataset.gzoom){ UI.ganttZoom = Number(btn.dataset.gzoom); render(); return; }
  if (btn?.dataset.iaba){ UI.indAba = btn.dataset.iaba; render(); return; }
  if (btn?.dataset.rfiltro){ UI.recFiltro = btn.dataset.rfiltro; render(); return; }
  if (btn?.dataset.calmeus){ UI.calMeus = btn.dataset.calmeus==='1'; render(); return; }
  if (id==='calAnt' || id==='calProx'){ let [y,m] = UI.cal; m += id==='calAnt'?-1:1; if (m<0){m=11;y--;} if (m>11){m=0;y++;} UI.cal=[y,m]; UI.calSel=null; garantirFeriados(y); render(); return; }
  if (id==='calHoje'){ const h = pd(HOJE); UI.cal = [h.getFullYear(), h.getMonth()]; UI.calSel = HOJE; render(); return; }
  const dia = t.closest('[data-dia]'); if (dia){ UI.calSel = dia.dataset.dia; const d = pd(UI.calSel); UI.cal = [d.getFullYear(), d.getMonth()]; render(); return; }
  if (id==='btnNotif'){ Notification.requestPermission().then(p=>{ if (p==='granted'){ toast('Notificações ativadas.'); notificarAoAbrir(); } render(); }); return; }
  if (id==='btnImprimir') return window.print();
  if (id==='btnCsvAtv') return exportar('atv'); if (id==='btnCsvLanc') return exportar('lanc'); if (id==='btnCsvTar') return exportar('tar'); if (id==='btnCsvRec') return exportar('rec');
  if (!ehGestor()) return;
  // ----- somente gestor
  if (id==='addPessoa') return abrirPessoa(null);
  if (id==='cfNovoAno') return abrirReinicio('ano');
  if (id==='cfZerar') return abrirReinicio('zerar');
  if (id==='fAddF'){ lerFuncoesTela(); S.funcoes.push({id:'f'+uid(), num:S.funcoes.length+1, nome:'Nova função', subs:[]}); salvar(); render(); return; }
  if (btn?.dataset.adds){ lerFuncoesTela(); S.funcoes.find(f=>f.id===btn.dataset.adds).subs.push({id:'s'+uid(), nome:'Nova subfunção'}); salvar(); render(); return; }
  if (btn?.dataset.dels){ const [fid, sid] = btn.dataset.dels.split('|'); lerFuncoesTela(); const f = S.funcoes.find(x=>x.id===fid); f.subs = f.subs.filter(s=>s.id!==sid); S.atividades.forEach(a=>a.funcoes = (a.funcoes||[]).filter(x=>x!==sid)); salvar(); render(); return; }
  if (btn?.dataset.delf2){ if (!confirm('Remover esta função e suas subfunções?')) return; lerFuncoesTela(); const f = S.funcoes.find(x=>x.id===btn.dataset.delf2); const ids = [f.id, ...f.subs.map(s=>s.id)]; S.funcoes = S.funcoes.filter(x=>x!==f); S.atividades.forEach(a=>a.funcoes = (a.funcoes||[]).filter(x=>!ids.includes(x))); salvar(); render(); return; }
  if (id==='fSalvar'){ lerFuncoesTela(); S.config.funcoesProvisorias = false; salvar(); render(); toast('Funções salvas.'); return; }
  if (id==='fImportar'){
    const linhas = $('#fColar').value.split(/\r?\n/).map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim());
    const nova = []; linhas.forEach(l=>{ const sub = /^\s*([-–•*]|\d+\.\d+)/.test(l) || /^\s{2,}/.test(l); const nome = l.replace(/^\s*([-–•*]|\d+(\.\d+)*[.)]?)\s*/,'').trim(); if (!nome) return;
      if (sub && nova.length) nova[nova.length-1].subs.push({nome}); else nova.push({nome, subs:[]}); });
    if (!nova.length) { toast('Nada para importar.'); return; }
    if (!confirm(`Substituir a lista atual por ${nova.length} função(ões) e ${nova.reduce((s,f)=>s+f.subs.length,0)} subfunção(ões)?`)) return;
    const antigos = new Map(); S.funcoes.forEach(f=>{ antigos.set(norm(f.nome), f.id); f.subs.forEach(s=>antigos.set(norm(f.nome)+'|'+norm(s.nome), s.id)); });
    S.funcoes = nova.map((f,i)=>({id: antigos.get(norm(f.nome)) || 'f'+uid(), num:i+1, nome:f.nome, subs:f.subs.map(s=>({id: antigos.get(norm(f.nome)+'|'+norm(s.nome)) || 's'+uid(), nome:s.nome}))}));
    const validos = new Set(S.funcoes.flatMap(f=>[f.id, ...f.subs.map(s=>s.id)])); S.atividades.forEach(a=>a.funcoes = (a.funcoes||[]).filter(x=>validos.has(x)));
    S.config.funcoesProvisorias = false; salvar(); render(); toast('Lista de funções substituída.'); return;
  }
  if (id==='cfSalvar'){
    S.config.nomeCentro = $('#cfNome').value.trim() || 'Centro de Inovação';
    S.config.ano = Number($('#cfAno').value) || S.config.ano;
    S.config.diasAlerta = Math.max(1, Number($('#cfDias').value)||30);
    S.config.diasSemRegistro = Math.max(7, Number($('#cfSemReg').value)||45);
    garantirFeriados(S.config.ano);
    salvar(); UI.cal = null; render(); toast('Configurações salvas.'); return;
  }
  if (id==='cfAjudas'){ S.config.ajudaOculta = {}; salvar(); toast('As descrições voltarão a aparecer em todas as telas.'); return; }
  if (id==='cfLogo') return $('#arqLogo').click();
  if (id==='cfLogoDel'){ S.config.logo = null; salvar(); render(); return; }
  if (id==='addFer'){ const d = $('#ferData').value, n = $('#ferNome').value.trim(); if (!d || !n) { toast('Informe data e descrição.'); return; } S.feriados.push({id:uid(), data:d, nome:n, tipo:$('#ferTipo').value, manual:true, recorrente:$('#ferRec').checked}); salvar(); render(); toast('Feriado adicionado.'); return; }
  if (btn?.dataset.delf){ S.feriados = S.feriados.filter(f=>f.id!==btn.dataset.delf); salvar(); render(); return; }
  if (id==='ferPadrao'){ garantirFeriados(S.config.ano, true); render(); toast(`Feriados de ${S.config.ano} atualizados. Os cadastrados manualmente foram mantidos.`); return; }
  if (id==='dExport') return baixar(`backup_centro_inovacao_${HOJE}.json`, JSON.stringify(S), 'application/json');
  if (id==='dImport') return $('#arqJson').click();
  if (id==='dLimparEx'){ if (confirm('Apagar progresso, tarefas, recursos, compromissos e atividades extras de exemplo? As atividades da planilha continuam.')){ S.atividades = S.atividades.filter(a=>!a.exemplo); S.atividades.forEach(a=>{ a.lancamentos = a.lancamentos.filter(l=>!l.exemplo); a.recursos = a.recursos.filter(r=>!r.exemplo); }); S.tarefas = S.tarefas.filter(x=>!x.exemplo); S.agenda = S.agenda.filter(x=>!x.exemplo); salvar(); render(); toast('Dados de exemplo apagados.'); } return; }
  if (id==='dReset'){ if (confirm('Substituir tudo pelos dados originais da planilha (com exemplos)? Fotos, senhas e logo também voltam ao padrão.')){ const sid = S.sessao.usuarioId; S = estadoExemplo(); S.sessao.usuarioId = S.usuarios.some(u=>u.id===sid) ? sid : 'u-gestor'; salvar(); render(); } return; }
});
function lerFuncoesTela(){
  $$('[data-fnome]').forEach(i=>{ const f = S.funcoes.find(x=>x.id===i.dataset.fnome); if (f && i.value.trim()) f.nome = i.value.trim(); });
  $$('[data-snome]').forEach(i=>{ const [fid, sid] = i.dataset.snome.split('|'); const s = S.funcoes.find(x=>x.id===fid)?.subs.find(x=>x.id===sid); if (s && i.value.trim()) s.nome = i.value.trim(); });
}
document.addEventListener('change', e=>{
  const t = e.target;
  if (t.closest('#modal') && ED && !NV){ if (t.id==='rgProg') return; edSujo = edAba!=='resumo' && edAba!=='assistente'; if (t.dataset.k==='inicio' || t.dataset.k==='fim'){ lerCamposEditor(); if (ED.inicio && ED.fim && ED.fim>=ED.inicio) ED.meses = mesesDoIntervalo(ED.inicio, ED.fim); } return; }
  if (t.closest('#modal') && NV){ if (t.dataset.n==='inicio' || t.dataset.n==='fim'){ lerNova(); NV.a.meses = mesesDoIntervalo(NV.a.inicio, NV.a.fim); desenharNova(); } return; }
  if (t.id==='pgAtv'){ abrirProgresso(t.value); return; }
  if (t.id==='fResp'){ UI.fResp = t.value; render(); return; }
  if (t.id==='qResp'){ UI.qResp = t.value; render(); return; }
  if (t.id==='qAtv'){ UI.qAtv = t.value; render(); return; }
  if (t.id==='gResp'){ UI.ganttResp = t.value; render(); return; }
  if (t.id==='relEscopo'){ UI.relEscopo = t.value; render(); return; }
  if (t.id==='cfTema'){ S.config.tema = t.value; salvar(); aplicarTema(); return; }
  if (t.dataset.recst){ const [aid, rid] = t.dataset.recst.split('|'); const r = atividade(aid).recursos.find(x=>x.id===rid); r.status = t.value; r.atualizadoEm = HOJE; salvar(); render(); toast(`Recurso marcado como “${ST_REC[t.value]}”.`); return; }
  if (t.id==='arqJson' && t.files[0]){ const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.atividades || !d.usuarios) throw 0; if (ONLINE){ if (!ehGestor()) throw 0; const loc = {}; LOCAIS.forEach(k=>loc[k]=S.config[k]); const ses = S.sessao; S = {...estadoBaseOnline(), ...d, sessao:ses}; S.config = {...S.config, ...loc}; S.usuarios.forEach(u=>delete u.pin); salvar(); render(); toast('Backup importado. Enviando ao servidor…'); return; } const sid = S.sessao.usuarioId; localStorage.setItem(KEY, JSON.stringify(d)); S = carregar(); S.sessao.usuarioId = S.usuarios.some(u=>u.id===sid)?sid:null; salvar(); render(); toast('Backup importado.'); } catch(x){ toast('Arquivo inválido.'); } }; r.readAsText(t.files[0]); t.value=''; return; }
  if (t.id==='arqLogo' && t.files[0] && ONLINE){ reduzirLogo(t.files[0], url => { S.config.logo = url; salvar(); render(); toast('Logo atualizado.'); }); t.value=''; return; }
  if (t.id==='arqLogo' && t.files[0]){ const f = t.files[0]; if (f.size > 2e6) { toast('Imagem muito grande (máx. 2 MB).'); t.value=''; return; } const r = new FileReader(); r.onload = () => { S.config.logo = r.result; salvar(); render(); toast('Logo atualizado.'); }; r.readAsDataURL(f); t.value=''; return; }
  if (t.id==='arqFoto' && t.files[0]){ reduzirImagem(t.files[0], 192, url => { if (!M2) return; M2.foto = url; $('#pFotoPrev').innerHTML = avatar({foto:url},84); }); t.value=''; return; }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.id==='zrTexto'){ $('#zrConfirmar').disabled = t.value.trim().toUpperCase()!=='ZERAR'; return; }
  if (t.id==='rgProg'){ const a = ED || {}; $('#rgOut').textContent = fmtN(Number(t.value),1) + (a.unidade==='%'?'%':''); return; }
  if (t.id==='pgRange'){ const a = atividade(M2.id); $('#pgOut').textContent = fmtN(Number(t.value),1) + unid(a); return; }
  if (t.closest('#modal') && ED && !NV && !['resumo','assistente'].includes(edAba)) edSujo = true;
  if (t.id==='fBusca'){ clearTimeout(window._bt); const v = t.value; window._bt = setTimeout(()=>{ UI.fBusca = v; render(); const b = $('#fBusca'); b.focus(); b.setSelectionRange(v.length, v.length); }, 250); }
});
document.addEventListener('keydown', e=>{
  if (e.key==='Enter' && e.target.id==='pinLogin') return entrar();
  if (e.key!=='Escape') return;
  if ($('#fundo2').classList.contains('aberto')) return fecharM2();
  if ($('#fundo').classList.contains('aberto')) { if (NV) { NV = null; $('#fundo').classList.remove('aberto'); } else fecharModal(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
if (ONLINE) iniciarOnline();
else {
  { const ah = new Date(); garantirFeriados(ah.getFullYear()); garantirFeriados(S.config.ano); if (ah.getMonth() >= 8) garantirFeriados(ah.getFullYear() + 1); }
  prepararPWA();
  aplicarTema(); render(); atualizarBotoesApp(); if (S.sessao.usuarioId) setTimeout(notificarAoAbrir, 700);
}
</script>
</body>
</html>
