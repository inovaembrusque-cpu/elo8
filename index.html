<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111822">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Elo 8">
<title>Elo 8 · Gestão de Metas da Rede INOVA</title>
<link rel="icon" id="favicon">
<style>
:root{
  --navy:#111822; --navy-2:#1A2431; --navy-3:#24313F;
  --petroleo:#1D5671; --gelo:#D1FAFE; --salmao:#FC9972; --laranja:#FA531E;
  --bg:#F3F7F9; --card:#FFFFFF; --card-2:#F7FAFB; --linha:#E1E8EC; --linha-2:#CFDAE0;
  --txt:#14202B; --txt-2:#4C5D6B; --txt-3:#7C8C99;
  --primaria:#1D5671; --primaria-txt:#FFFFFF; --primaria-suave:#E3F1F6;
  --ok:#1F8A70; --ok-suave:#E1F4EE; --and:#1D5671; --and-suave:#E3F1F6;
  --atencao:#C2561F; --atencao-cor:#FC9972; --atencao-suave:#FFEDE5;
  --perigo:#D7400F; --perigo-cor:#FA531E; --perigo-suave:#FFE3D9;
  --neutro:#8A99A6; --neutro-suave:#EEF2F4;
  --sombra:0 1px 2px rgba(17,24,34,.06),0 4px 14px rgba(17,24,34,.05);
  --raio:14px;
  --lateral:#111822; --lateral-2:#1A2431; --lateral-3:#24313F; --destaque:var(--txt);
}
:root[data-theme="dark"]{
  --bg:#0C1219; --card:#131C26; --card-2:#17222E; --linha:#223140; --linha-2:#2C3E4F;
  --txt:#E6EEF3; --txt-2:#A7B7C3; --txt-3:#7B8C99;
  --primaria:#4FA3C7; --primaria-txt:#0C1219; --primaria-suave:#173445;
  --ok:#4CC3A0; --ok-suave:#15322B; --and:#4FA3C7; --and-suave:#173445;
  --atencao:#FDB08F; --atencao-cor:#FC9972; --atencao-suave:#3A261C;
  --perigo:#FF7A4D; --perigo-cor:#FA531E; --perigo-suave:#3D1F15;
  --neutro:#7B8C99; --neutro-suave:#1C2733;
  --sombra:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primaria)}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.lateral{background:var(--lateral);color:#DCE7EE;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;padding-top:env(safe-area-inset-top)}
.marca{display:flex;align-items:center;gap:12px;padding:18px 18px 16px}
.logo{width:48px;height:48px;border-radius:12px;flex:0 0 48px;overflow:hidden;background:var(--navy);display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:contain}
.marca b{display:block;color:#fff;font-size:15px;line-height:1.2}
.nome-sis{font-size:21px!important;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.sub-sis{display:block;font-size:11.5px;color:#8FA6B6;line-height:1.3}
.nome-sis::after{content:"";display:block;width:26px;height:3px;border-radius:2px;margin-top:4px;background:linear-gradient(90deg,var(--gelo),var(--salmao),var(--laranja))}
.marca span{font-size:12px;color:#8FA6B6}
.nav{padding:4px 10px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grupo{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#6C8597;font-weight:700;padding:16px 12px 6px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:9px;color:#B9CAD5;font-size:14px}
.nav button svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav button:hover{background:var(--lateral-2);color:#fff}
.nav button.ativo{background:var(--petroleo);color:#fff}
.nav button .cont{margin-left:auto;background:var(--laranja);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
.sessao{padding:14px 14px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--lateral-3);display:flex;gap:10px;align-items:center}
.sessao .q{flex:1;min-width:0;cursor:pointer}
.sessao .q b{display:block;color:#fff;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sessao .q small{color:#7F97A8;font-size:11.5px}
.sessao .avatar{box-shadow:0 0 0 2px rgba(255,255,255,.18);cursor:pointer}
.sair{all:unset;cursor:pointer;color:#8FA6B6;padding:6px;border-radius:8px;display:grid;place-items:center}
.sair:hover{background:var(--lateral-2);color:#fff}
.sair svg{width:18px;height:18px}
.principal{min-width:0;display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:12px;padding:16px 30px;background:var(--card);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:20}
.topo h1{font-size:20px;margin:0;font-weight:650}
.topo .esp{flex:1}
.icobtn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--linha);position:relative;color:var(--txt-2);flex:0 0 38px}
.icobtn:hover{background:var(--card-2)}
.icobtn svg{width:18px;height:18px}
.icobtn .ponto{position:absolute;top:-5px;right:-5px;background:var(--laranja);color:#fff;font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 6px;border:2px solid var(--card)}
.menu-btn{display:none}
.conteudo{padding:22px 30px 56px;max-width:1440px;width:100%}
.ajuda{display:flex;gap:14px;align-items:flex-start;background:var(--primaria-suave);border:1px solid var(--linha);border-radius:var(--raio);padding:14px 16px;margin-bottom:20px}
.ajuda .ic{width:34px;height:34px;border-radius:10px;background:var(--primaria);color:var(--primaria-txt);display:grid;place-items:center;flex:0 0 34px}
.ajuda .ic svg{width:18px;height:18px}
.ajuda b{display:block;font-size:14px;margin-bottom:2px}
.ajuda p{margin:0;color:var(--txt-2);font-size:13.5px}
.ajuda ol{margin:6px 0 0;padding-left:18px;color:var(--txt-2);font-size:13px}
.ajuda .fechar{all:unset;cursor:pointer;color:var(--txt-3);font-size:12.5px;white-space:nowrap;padding:4px 8px;border-radius:6px}
.ajuda .fechar:hover{background:var(--card)}
.btn{border:1px solid var(--linha-2);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn.prim{background:var(--primaria);border-color:var(--primaria);color:var(--primaria-txt)}
.btn.prim:hover{filter:brightness(1.08)}
.btn.perigo{color:var(--perigo);border-color:var(--perigo-suave)}
.btn.peq{padding:5px 10px;font-size:12.5px}
.btn.fant{border-color:transparent;background:transparent}
.btn svg{width:16px;height:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);box-shadow:var(--sombra)}
.card .cab{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--linha)}
.card .cab h3{margin:0;font-size:15px;font-weight:650}
.card .cab .desc{font-size:12.5px;color:var(--txt-3);font-weight:400}
.card .cab .esp{flex:1}
.card .corpo{padding:16px 18px}
.grade{display:grid;gap:18px}
.grade>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-inicio{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.tile{background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px 18px;box-shadow:var(--sombra);display:flex;gap:14px;align-items:center}
.tile.clic{cursor:pointer}.tile.clic:hover{border-color:var(--linha-2)}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 42px}
.tile .ic svg{width:20px;height:20px}
.tile .v{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .r{font-size:13px;color:var(--txt-2);font-weight:600}
.tile .d{font-size:12px;color:var(--txt-3)}
.acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.acao{all:unset;cursor:pointer;background:var(--card);border:1px solid var(--linha);border-radius:var(--raio);padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--sombra)}
.acao:hover{border-color:var(--primaria)}
.acao .ic{width:40px;height:40px;border-radius:12px;background:var(--primaria);color:var(--primaria-txt);display:grid;place-items:center;flex:0 0 40px}
.acao .ic svg{width:20px;height:20px}
.acao b{display:block;font-size:14.5px}
.acao b+span{display:block;font-size:12.5px;color:var(--txt-3)}
.saudacao{font-size:22px;font-weight:650;margin:0 0 4px}
.saudacao+p{margin:0 0 18px;color:var(--txt-2)}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.campo{display:flex;flex-direction:column;gap:5px}
.campo>span{font-size:12.5px;color:var(--txt-2);font-weight:650}
.campo>small{font-size:12px;color:var(--txt-3)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],input[type=password],select,textarea{background:var(--card);border:1px solid var(--linha-2);border-radius:9px;padding:9px 11px;outline:none;min-width:0;width:100%}
.filtros select,.filtros input{width:auto;padding:7px 10px}
input:focus,select:focus,textarea:focus{border-color:var(--primaria);box-shadow:0 0 0 3px var(--primaria-suave)}
textarea{resize:vertical;min-height:70px}
input[type=range]{width:100%;accent-color:var(--primaria);height:28px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;padding:3px 10px;border-radius:20px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.st-concluida{background:var(--ok-suave);color:var(--ok)}.st-concluida i{background:var(--ok)}
.st-andamento{background:var(--and-suave);color:var(--and)}.st-andamento i{background:var(--and)}
.st-proximo{background:var(--atencao-suave);color:var(--atencao)}.st-proximo i{background:var(--atencao-cor)}
.st-atrasada{background:var(--perigo-suave);color:var(--perigo)}.st-atrasada i{background:var(--perigo-cor)}
.st-naoiniciada{background:var(--neutro-suave);color:var(--txt-2)}.st-naoiniciada i{background:var(--neutro)}
.st-cancelada{background:var(--neutro-suave);color:var(--txt-3)}.st-cancelada i{background:var(--neutro)}
.st-extra{background:var(--gelo);color:#1D5671}.st-extra i{background:#1D5671}
:root[data-theme="dark"] .st-extra{background:#173445;color:#9ADAF0}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--card-2);border:1px solid var(--linha);color:var(--txt-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.prog{height:8px;background:var(--neutro-suave);border-radius:6px;overflow:hidden;position:relative}
.prog b{display:block;height:100%;border-radius:6px;background:var(--primaria)}
.prog .esperado{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--txt-2);opacity:.5}
/* pontos de progresso */
.pontos{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.pt{all:unset;width:16px;height:16px;border-radius:50%;border:2px solid var(--linha-2);background:var(--card);cursor:pointer;flex:0 0 auto;transition:transform .1s}
.pt:hover{transform:scale(1.18);border-color:var(--primaria)}
.pt.on{background:var(--cor,var(--primaria));border-color:var(--cor,var(--primaria))}
.pt.zero{border-style:dashed;width:12px;height:12px;opacity:.6}
.pontos.grandes .pt{width:28px;height:28px;border-width:2.5px}
.pontos.grandes .pt.zero{width:20px;height:20px}
.pontos[data-ro] .pt{cursor:default}.pontos[data-ro] .pt:hover{transform:none}
.slider-box{display:flex;gap:14px;align-items:center}
.slider-box output{min-width:80px;text-align:right;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.tabela{width:100%;border-collapse:collapse}
.tabela th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-3);font-weight:650;padding:10px 12px;border-bottom:1px solid var(--linha);background:var(--card-2)}
.tabela td{padding:10px 12px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tabela tr:last-child td{border-bottom:0}
.tabela tr.clic{cursor:pointer}.tabela tr.clic:hover td{background:var(--card-2)}
.tabela .num{text-align:right;font-variant-numeric:tabular-nums}
.tab-wrap{overflow:auto}
.vazio{padding:28px;text-align:center;color:var(--txt-3)}
.avatar{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;color:#fff;overflow:hidden;flex:0 0 auto}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pessoa{display:inline-flex;align-items:center;gap:8px;min-width:0}
.muted{color:var(--txt-3)}.peq{font-size:12.5px}
.linha-flex{display:flex;align-items:center;gap:8px}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;padding:6px 13px;border-radius:20px;border:1px solid var(--linha-2);font-size:13px;font-weight:600;color:var(--txt-2);background:var(--card)}
.chip .n{font-size:11.5px;opacity:.75;margin-left:4px}
.chip.ativo{background:var(--primaria);border-color:var(--primaria);color:var(--primaria-txt)}
.secao-titulo{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-3);font-weight:700;margin:22px 0 10px}
.aviso{background:var(--primaria-suave);border:1px solid var(--linha);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--txt-2)}
.aviso.atn{background:var(--atencao-suave);color:var(--atencao);border-color:transparent}
.lista-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--linha);cursor:pointer}
.lista-item:last-child{border-bottom:0}
.lista-item:hover .tit{color:var(--primaria)}
.lista-item .tit{font-weight:600;font-size:13.5px}
.alerta{display:flex;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--linha);background:var(--card);align-items:flex-start;cursor:pointer}
.alerta+.alerta{margin-top:8px}
.alerta:hover{border-color:var(--linha-2)}
.alerta .sev{width:4px;align-self:stretch;border-radius:4px;flex:0 0 4px}
.alerta.alta .sev{background:var(--perigo-cor)}.alerta.media .sev{background:var(--atencao-cor)}.alerta.baixa .sev{background:var(--primaria)}
.alerta .tx{flex:1;min-width:0}
.alerta .tx b{display:block;font-size:13.5px}
.alerta .tx span{font-size:12.5px;color:var(--txt-2)}
.alerta .tp{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--txt-3)}
/* lista de atividades */
.atv{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,280px) 130px;gap:18px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--linha)}
.atv:last-child{border-bottom:0}
.atv:hover{background:var(--card-2)}
.atv .abre{cursor:pointer;min-width:0}
.atv .tit{font-weight:650;font-size:14px;line-height:1.3}
.atv .sub{font-size:12.5px;color:var(--txt-3);margin-top:3px}
.atv .num{font-size:12.5px;display:flex;justify-content:space-between;margin-bottom:6px;gap:8px}
.atv .funcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.btn-prog{all:unset;cursor:pointer;font-size:12px;font-weight:650;color:var(--primaria);padding:2px 0}
.btn-prog:hover{text-decoration:underline}
/* quadro */
.quadro{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;align-items:start;overflow-x:auto;padding-bottom:6px}
.coluna{background:var(--card-2);border:1px solid var(--linha);border-radius:var(--raio);display:flex;flex-direction:column;min-height:300px}
.coluna .ccab{padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--linha)}
.coluna .ccab b{font-size:14px}
.coluna .ccab i{width:10px;height:10px;border-radius:3px}
.coluna .ccab .n{margin-left:auto;font-size:12px;font-weight:700;color:var(--txt-3);background:var(--card);border:1px solid var(--linha);border-radius:20px;padding:0 8px}
.coluna .cdesc{font-size:12px;color:var(--txt-3);padding:8px 14px 0}
.coluna .ccorpo{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.coluna.alvo{outline:2px dashed var(--primaria);outline-offset:-4px}
.tarefa{background:var(--card);border:1px solid var(--linha);border-radius:11px;padding:11px 12px;cursor:grab;box-shadow:0 1px 2px rgba(17,24,34,.05)}
.tarefa:hover{border-color:var(--linha-2)}
.tarefa.arrastando{opacity:.4}
.tarefa .tt{font-weight:600;font-size:13.5px;line-height:1.3}
.tarefa .ta{font-size:12px;color:var(--txt-3);margin-top:4px}
.tarefa .tr{display:flex;align-items:center;gap:8px;margin-top:9px}
.tarefa .motivo{font-size:12px;background:var(--atencao-suave);color:var(--atencao);border-radius:7px;padding:5px 8px;margin-top:8px}
.tarefa .sug{font-size:10.5px;font-weight:700;color:var(--primaria);text-transform:uppercase;letter-spacing:.05em}
.prio{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px}
.prio.alta{background:var(--perigo-suave);color:var(--perigo)}.prio.media{background:var(--atencao-suave);color:var(--atencao)}.prio.baixa{background:var(--neutro-suave);color:var(--txt-2)}
.addcol{all:unset;cursor:pointer;font-size:13px;color:var(--txt-3);padding:8px 10px;border-radius:8px;text-align:center}
.addcol:hover{background:var(--card);color:var(--primaria)}
/* equipe */
.membro{text-align:center;padding:22px 18px;cursor:pointer}
.membro .nome{font-weight:650;font-size:15px;margin-top:10px}
.membro .papel{font-size:12.5px;color:var(--txt-3)}
.membro .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.membro .nums div{background:var(--card-2);border-radius:10px;padding:8px 4px}
.membro .nums b{display:block;font-size:17px}
.membro .nums small{font-size:11px;color:var(--txt-3)}
.foto-edit{display:flex;gap:16px;align-items:center}
/* funções */
.arvore{display:flex;flex-direction:column;gap:10px}
.fgrupo{border:1px solid var(--linha);border-radius:12px;padding:10px 12px;background:var(--card)}
.fgrupo>.fnome{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:8px}
.fgrupo .fsubs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fsel{cursor:pointer}
.fsel input{display:none}
.fsel span{display:inline-block;padding:5px 11px;border-radius:20px;border:1px solid var(--linha-2);font-size:12.5px;color:var(--txt-2);background:var(--card)}
.fsel input:checked+span{background:var(--primaria);color:var(--primaria-txt);border-color:var(--primaria)}
.fchip{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:20px;background:var(--primaria-suave);color:var(--primaria);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
/* calendário */
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav h2{margin:0;font-size:18px;min-width:190px;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--linha);border-top:1px solid var(--linha)}
.cal .dsem{padding:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-3);font-weight:650;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);background:var(--card-2)}
.cal .dia{min-height:108px;padding:6px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dia:hover{background:var(--card-2)}
.cal .dia.fora{background:var(--bg);opacity:.5}
.cal .dia.fds{background:var(--card-2)}
.cal .dia.feriado{background:repeating-linear-gradient(135deg,var(--atencao-suave),var(--atencao-suave) 6px,transparent 6px,transparent 12px)}
.cal .dia.hoje .n{background:var(--primaria);color:var(--primaria-txt);border-radius:50%}
.cal .dia.sel{outline:2px solid var(--primaria);outline-offset:-2px}
.cal .n{font-size:12.5px;font-weight:650;width:24px;height:24px;display:grid;place-items:center}
.ev{font-size:11.5px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid}
.ev.feriado{background:var(--atencao-suave);border-color:var(--atencao-cor);color:var(--atencao);font-weight:600}
.ev.evento{background:var(--primaria);border-color:var(--navy);color:var(--primaria-txt);font-weight:600}
.ev.prazo{background:var(--perigo-suave);border-color:var(--perigo-cor);color:var(--perigo)}
.ev.inicio{background:var(--and-suave);border-color:var(--primaria);color:var(--and)}
.ev.marco{background:var(--card-2);border-color:var(--txt-3);color:var(--txt-2)}
.ev.feito{opacity:.6;text-decoration:line-through}
.ev.recurso{background:var(--ok-suave);border-color:var(--ok);color:var(--ok)}
.ev.tarefa{background:var(--card);border-color:var(--navy);color:var(--txt)}
.ev.extra{background:var(--gelo);border-color:#1D5671;color:#1D5671}
.cal .mais{font-size:11px;color:var(--txt-3);padding-left:4px}
.legenda{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--txt-2)}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
/* gantt */
.gantt-wrap{overflow:auto;max-height:calc(100vh - 300px);position:relative}
.gantt{position:relative}
.g-row{display:flex;border-bottom:1px solid var(--linha);min-height:34px}
.g-row.grupo{background:var(--card-2);font-weight:650}
.g-lbl{position:sticky;left:0;z-index:5;background:var(--card);flex:0 0 320px;width:320px;padding:7px 12px;border-right:1px solid var(--linha);font-size:12.5px;display:flex;align-items:center;gap:8px;cursor:pointer}
.g-row.grupo .g-lbl{background:var(--card-2);cursor:default}
.g-lbl .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.g-trk{position:relative;flex:0 0 auto}
.g-head{position:sticky;top:0;z-index:8;background:var(--card);display:flex;border-bottom:1px solid var(--linha-2)}
.g-head .g-lbl{z-index:9;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-3);font-weight:650;cursor:default}
.g-mes{position:absolute;top:0;bottom:0;border-left:1px solid var(--linha);font-size:12px;font-weight:650;padding:8px 6px;color:var(--txt-2)}
.g-seg{position:absolute;top:9px;height:16px;border-radius:5px;overflow:hidden;cursor:pointer}
.g-seg b{position:absolute;left:0;top:0;bottom:0}
.g-marco{position:absolute;top:11px;width:11px;height:11px;transform:rotate(45deg);border:2px solid var(--card);cursor:pointer}
.g-hoje{position:absolute;top:0;bottom:0;width:2px;background:var(--laranja);z-index:4;pointer-events:none}
.g-grade{position:absolute;top:0;bottom:0;border-left:1px dashed var(--linha);pointer-events:none}
.g-pct{position:absolute;top:9px;font-size:11px;font-weight:650;color:var(--txt-2);white-space:nowrap}
.hbar{display:grid;grid-template-columns:minmax(120px,260px) 1fr 52px;gap:12px;align-items:center;padding:7px 0}
.hbar .nome{font-size:13px}
.hbar .trilho{height:12px;background:var(--neutro-suave);border-radius:4px;position:relative;overflow:hidden}
.hbar .trilho b{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--primaria)}
.hbar .val{text-align:right;font-weight:650;font-variant-numeric:tabular-nums;font-size:13px}
.empilhada{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--neutro-suave)}
.empilhada span{display:block;height:100%}
/* assistente */
.diag{display:flex;gap:16px;align-items:flex-start;border-radius:12px;padding:14px 16px;border:1px solid var(--linha)}
.diag .nivel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 10px;border-radius:20px;white-space:nowrap}
.diag.baixo .nivel{background:var(--ok-suave);color:var(--ok)}
.diag.medio .nivel{background:var(--atencao-suave);color:var(--atencao)}
.diag.alto .nivel,.diag.critico .nivel{background:var(--perigo-suave);color:var(--perigo)}
.diag ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--txt-2)}
.sug-item{display:grid;grid-template-columns:22px minmax(0,1fr) 150px 104px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--linha)}
.sug-item input[type=text],.sug-item input[type=date],.sug-item select{padding:7px 9px}
.sug-item .sug-tit{font-weight:600}
.sug-item input.sug-on{margin-top:10px}
.sug-item:last-child{border-bottom:0}
.sug-item input.sug-on{width:18px;height:18px;accent-color:var(--primaria)}
.sug-item .st{font-weight:600;font-size:13.5px}
.sug-item details{margin-top:3px}
.sug-item summary{cursor:pointer;font-size:12px;color:var(--primaria);list-style:none}
.sug-item summary::-webkit-details-marker{display:none}
.sug-item .porque{font-size:12.5px;color:var(--txt-2);background:var(--card-2);border-radius:8px;padding:8px 10px;margin-top:5px}
.sug-item .quando{font-size:12.5px;color:var(--txt-3);text-align:right;white-space:nowrap}
.robo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#1D5671,#FA531E);color:#fff;display:grid;place-items:center;flex:0 0 34px}
.robo svg{width:18px;height:18px}
/* modal */
.fundo{position:fixed;inset:0;background:rgba(10,16,24,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow-y:auto}
.fundo.aberto{display:flex}
#fundo2{z-index:110}
.modal{background:var(--card);border-radius:16px;width:min(920px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:92vh}
.modal.peq{width:min(560px,100%)}
.modal .mcab{padding:20px 24px 0;display:flex;align-items:flex-start;gap:12px}
.modal .mcab h2{margin:0;font-size:19px;flex:1;line-height:1.3}
.modal .mcab .sobre{font-size:12.5px;color:var(--txt-3);margin-bottom:3px}
.modal .mabas{display:flex;gap:2px;padding:12px 24px 0;border-bottom:1px solid var(--linha);overflow-x:auto}
.modal .mabas button{all:unset;cursor:pointer;padding:9px 12px;font-size:13.5px;color:var(--txt-2);border-bottom:2px solid transparent;white-space:nowrap}
.modal .mabas button.ativo{color:var(--primaria);border-color:var(--primaria);font-weight:650}
.modal .mabas button .c{font-size:11px;background:var(--neutro-suave);border-radius:10px;padding:0 6px;margin-left:4px}
.modal .mcorpo{padding:20px 24px;overflow-y:auto;flex:1}
.modal .mrod{padding:14px 24px;border-top:1px solid var(--linha);display:flex;gap:10px;align-items:center}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.form .s1{grid-column:span 1}.form .s2{grid-column:span 2}.form .s3{grid-column:span 3}.form .s4{grid-column:span 4}.form .s6{grid-column:span 6}
.meses{display:flex;flex-wrap:wrap;gap:6px}
.meses label{cursor:pointer}
.meses input{display:none}
.meses span{display:inline-block;padding:5px 10px;border-radius:7px;border:1px solid var(--linha-2);font-size:12.5px;font-weight:600;color:var(--txt-2)}
.meses input:checked+span{background:var(--primaria);border-color:var(--primaria);color:var(--primaria-txt)}
.mini-tab td,.mini-tab th{padding:7px 8px}
.resumo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.resumo>div{background:var(--card-2);border:1px solid var(--linha);border-radius:11px;padding:11px 13px;min-width:0}
.resumo small{display:block;font-size:11px;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.resumo b{font-size:17px}
.bloco-prog{border:1px solid var(--linha);border-radius:14px;padding:16px 18px;margin-top:16px}
.bloco-prog h4{margin:0 0 4px;font-size:14px}
details.mais{border:1px solid var(--linha);border-radius:11px;padding:0 14px;margin-top:16px}
details.mais summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:13.5px;color:var(--txt-2)}
details.mais[open] summary{border-bottom:1px solid var(--linha);margin-bottom:14px}
details.mais>.form{padding-bottom:14px}
.passos{display:flex;gap:8px;padding:14px 24px 0}
.passo{flex:1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--txt-3);font-weight:600}
.passo i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;border:2px solid var(--linha-2);font-size:12px;flex:0 0 24px}
.passo.ativo{color:var(--primaria)}.passo.ativo i{border-color:var(--primaria);background:var(--primaria);color:var(--primaria-txt)}
.passo.ok i{border-color:var(--ok);background:var(--ok);color:#fff}
.passo .barra{flex:1;height:2px;background:var(--linha)}
.dica{font-size:12.5px;color:var(--txt-3);margin:0 0 16px}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--sombra);font-size:13.5px;max-width:380px;animation:ent .25s ease;display:flex;gap:12px;align-items:center}
.toast div button{all:unset;cursor:pointer;color:var(--salmao);font-weight:700;white-space:nowrap}
@keyframes ent{from{transform:translateY(10px);opacity:0}}
.pop{position:absolute;right:30px;top:66px;width:400px;max-height:70vh;overflow:auto;z-index:30;padding:12px}
/* login */
[hidden]{display:none!important}
.login{position:fixed;inset:0;z-index:300;background:var(--navy);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.login .caixa{background:var(--card);border-radius:20px;width:min(620px,100%);padding:30px 32px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.login .topo-l{display:flex;gap:14px;align-items:center;margin-bottom:22px}
.login .topo-l .logo{width:56px;height:56px;flex-basis:56px}
.login h1{margin:0;font-size:21px}
.login .pessoas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:14px 0 18px}
.login .pessoas button{all:unset;cursor:pointer;border:1px solid var(--linha);border-radius:14px;padding:14px 8px;text-align:center;font-size:13px;font-weight:600}
.login .pessoas button:hover{border-color:var(--primaria)}
.login .pessoas button.sel{border-color:var(--primaria);box-shadow:0 0 0 3px var(--primaria-suave)}
.login .pessoas .avatar{margin:0 auto 8px}
/* relatório */
.rel{background:#fff;color:#14202B;max-width:900px;margin:0 auto;padding:40px 48px;border-radius:8px;box-shadow:var(--sombra);font-size:13px}
.rel h1{font-size:22px;margin:0;color:#111822}
.rel h2{font-size:15px;color:#1D5671;margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid #D1FAFE}
.rel table{width:100%;border-collapse:collapse;font-size:12px}
.rel th{background:#1D5671;color:#fff;text-align:left;padding:6px 8px;font-weight:600}
.rel td{padding:6px 8px;border-bottom:1px solid #E1E8EC;vertical-align:top}
.rel .num{text-align:right}
.rel .rcab{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:3px solid #111822}
.rel .rcab .logo{width:60px;height:60px;flex-basis:60px}
.rel .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:16px}
.rel .kpis div{border:1px solid #E1E8EC;border-radius:8px;padding:10px;border-top:3px solid #1D5671}
.rel .kpis small{display:block;font-size:10.5px;color:#7C8C99;text-transform:uppercase}
.rel .kpis b{font-size:20px}
.rel .barrinha{height:7px;background:#EEF2F4;border-radius:4px;overflow:hidden;min-width:60px}
.rel .barrinha b{display:block;height:100%;background:#1D5671}
.rel .func{margin:8px 0 12px}
.rel .func b{color:#111822}
.rel .func ul{margin:4px 0 0;padding-left:18px}
.rel .bloco{page-break-inside:avoid}
/* padrões sugeridos */
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.sugchip{all:unset;cursor:pointer;font-size:12px;padding:3px 10px;border-radius:20px;border:1px dashed var(--linha-2);color:var(--txt-2);line-height:1.5}
.sugchip:hover{border-color:var(--primaria);color:var(--primaria)}
.sugchip::before{content:"+ ";opacity:.6}
.chkl{display:flex;flex-direction:column}
.chkl label{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:13.5px;cursor:pointer}
.chkl input{width:17px;height:17px;margin-top:1px;accent-color:var(--primaria);flex:0 0 auto}
a.btn{text-decoration:none;color:inherit}
a.btn.prim{color:var(--primaria-txt)}
.barra-inf{display:none}
.sinc{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--txt-3);white-space:nowrap;cursor:pointer;padding:4px 8px;border-radius:8px}
.sinc:hover{background:var(--card-2)}
.sinc i{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 8px}
.sinc.salvando i,.sinc.pendente i{background:var(--atencao-cor)}
.sinc.offline i{background:var(--perigo-cor)}
@media (max-width:700px){.sinc span{display:none}}
@media print{
  body{background:#fff}
  .lateral,.topo,.nao-imprime,.toast,.fundo,.ajuda,.login{display:none!important}
  .app{display:block}.conteudo{padding:0;max-width:none}
  .rel{box-shadow:none;padding:0;max-width:none}
  .rel h2{page-break-after:avoid} tr{page-break-inside:avoid}
}
@media (max-width:1200px){.g-inicio{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .lateral{position:fixed;left:-270px;width:252px;z-index:60;transition:left .2s}
  .lateral.aberta{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .menu-btn{display:grid}
  .conteudo{padding:16px}.topo{padding:12px 16px}.topo h1{font-size:17px}
  #btnNova .tx{display:none}
  .g2,.g3,.acoes{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{flex-direction:column;align-items:flex-start;gap:8px}
  .form{grid-template-columns:1fr 1fr}.form .s1,.form .s2,.form .s3,.form .s4,.form .s6{grid-column:span 2}
  .resumo{grid-template-columns:1fr 1fr}
  .atv{grid-template-columns:1fr;gap:10px}
  .quadro{grid-template-columns:repeat(4,82vw)}
  .cal .dia{min-height:64px}.cal .ev{font-size:10px;padding:1px 3px}
  .g-lbl{flex-basis:190px;width:190px}
  .pop{left:12px;right:12px;width:auto}
  .passo span{display:none}
  .rel{padding:20px}.rel .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .barra-inf{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--linha);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  .barra-inf button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--txt-3);padding:4px 6px;border-radius:10px;min-width:56px;position:relative;-webkit-tap-highlight-color:transparent}
  .barra-inf button svg{width:22px;height:22px}
  .barra-inf button.ativo{color:var(--primaria)}
  .barra-inf .cont{position:absolute;top:0;right:8px;background:var(--laranja);color:#fff;border-radius:20px;font-size:10px;padding:0 5px;font-weight:700}
  .conteudo{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
  .topo{padding-top:calc(12px + env(safe-area-inset-top))}
  #btnTela{display:none}
  .sug-item{grid-template-columns:22px minmax(0,1fr)}
  .sug-item .sug-data,.sug-item .sug-prio{grid-column:2}
}
@media (max-width:600px){
  .fundo{padding:0}
  .modal,.modal.peq{width:100%;max-height:100dvh;min-height:100dvh;border-radius:0}
  .modal .mcab{padding-top:calc(16px + env(safe-area-inset-top))}
  .modal .mrod{padding-bottom:calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap}
  .tiles{gap:10px}.tile{padding:12px}
  .tile .v{font-size:22px}
  .filtros select,.filtros input[type=search]{width:100%}
}
</style>
</head>
<body>
<div class="login" id="login" hidden></div>
<div class="app" id="app">
  <aside class="lateral" id="lateral">
    <div class="marca"><div class="logo" id="logoLateral"></div><div><b class="nome-sis">Elo 8</b><span class="sub-sis">Gestão de Metas da Rede INOVA</span><span id="nomeCentro" hidden></span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sessao"><span id="fotoSessao" title="Meu perfil"></span><div class="q" id="meuPerfil" title="Meu perfil"><b id="nomeSessao"></b><small id="papelSessao"></small></div><button class="sair" id="btnSair" title="Sair"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div>
  </aside>
  <main class="principal">
    <header class="topo">
      <button class="icobtn menu-btn" id="btnMenu" title="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="tituloVista">Início</h1>
      <button class="icobtn" id="btnAjuda" title="O que é esta tela?" style="width:28px;height:28px;flex-basis:28px;border-radius:50%"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
      <div class="esp"></div>
      <button class="btn prim" id="btnNova"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span class="tx" id="btnNovaTx">Nova atividade</span></button>
      <span class="sinc" id="sinc" hidden title="Sincronizar agora"><i></i><span>Sincronizado</span></span>
      <button class="btn" id="btnInstalar" hidden title="Instalar como aplicativo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span class="tx">Instalar app</span></button>
      <button class="icobtn" id="btnSino" title="Alertas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="ponto" id="sinoCont" hidden></span></button>
      <button class="icobtn" id="btnTema" title="Tema claro/escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      <button class="icobtn" id="btnTela" title="Tela cheia" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </header>
    <div class="card pop" id="popAlertas" hidden></div>
    <section class="conteudo" id="conteudo"></section>
  </main>
  <nav class="barra-inf" id="barraInf"></nav>
</div>

/* ================= FERIADOS ================= */
function pascoa(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1; return new Date(y,mes-1,dia);
}
function feriadosPadrao(y){
  const p = pascoa(y), f = (d,n,t='Nacional') => ({id:uid(), data: typeof d==='string'?d:iso(d), nome:n, tipo:t});
  return [
    f(`${y}-01-01`,'Confraternização Universal'),
    f(addDias(p,-48),'Carnaval','Ponto facultativo'), f(addDias(p,-47),'Carnaval','Ponto facultativo'),
    f(addDias(p,-46),'Quarta-feira de Cinzas (até 14h)','Ponto facultativo'),
    f(addDias(p,-2),'Sexta-feira Santa'), f(`${y}-04-21`,'Tiradentes'), f(`${y}-05-01`,'Dia do Trabalho'),
    f(addDias(p,60),'Corpus Christi','Ponto facultativo'),
    f(`${y}-08-04`,'Aniversário de Brusque','Municipal'),
    f(`${y}-09-07`,'Independência do Brasil'), f(`${y}-10-12`,'Nossa Senhora Aparecida'),
    f(`${y}-11-02`,'Finados'), f(`${y}-11-15`,'Proclamação da República'), f(`${y}-11-20`,'Dia Nacional de Zumbi e da Consciência Negra'),
    f(`${y}-12-25`,'Natal')
  ].sort((a,b)=>a.data.localeCompare(b.data));
}

/* Feriados do ano em questão: calculados localmente (Páscoa, Carnaval, Corpus Christi…) e
   conferidos na BrasilAPI quando houver internet; feriados manuais marcados como "repete" são copiados */
const feriadosBuscados = new Set();
function garantirFeriados(ano, forcar){
  ano = Number(ano); if (!ano || !S) return;
  const pref = ano + '-';
  if (forcar){ S.feriados = S.feriados.filter(f=>!f.data.startsWith(pref) || f.manual); feriadosBuscados.delete(ano); }
  if (forcar || !S.feriados.some(f=>f.data.startsWith(pref) && !f.manual)){
    const existe = d => S.feriados.some(f=>f.data===d);
    feriadosPadrao(ano).forEach(f=>{ if (!existe(f.data)) S.feriados.push(f); });
    const vistos = new Set();
    S.feriados.filter(f=>f.recorrente && !f.data.startsWith(pref)).forEach(f=>{
      const md = f.data.slice(5); if (vistos.has(md)) return; vistos.add(md);
      const d = pref + md; if (pd(d) && pd(d).getMonth()+1 === Number(md.slice(0,2)) && !existe(d)) S.feriados.push({id:uid(), data:d, nome:f.nome, tipo:f.tipo, recorrente:true});
    });
    salvar();
  }
  buscarFeriadosOnline(ano);
}
async function buscarFeriadosOnline(ano){
  if (feriadosBuscados.has(ano) || !navigator.onLine || !window.fetch) return;
  feriadosBuscados.add(ano);
  try {
    const ctrl = new AbortController(); const tm = setTimeout(()=>ctrl.abort(), 6000);
    const r = await fetch(`https://brasilapi.com.br/api/feriados/v1/${ano}`, {signal:ctrl.signal}); clearTimeout(tm);
    if (!r.ok) return;
    const lista = await r.json(); if (!Array.isArray(lista)) return;
    let n = 0;
    lista.forEach(x=>{ if (!x || !/^\d{4}-\d{2}-\d{2}$/.test(x.date||'') || S.feriados.some(f=>f.data===x.date)) return; S.feriados.push({id:uid(), data:x.date, nome:x.name, tipo:'Nacional', fonte:'BrasilAPI'}); n++; });
    S.config.feriadosOnline = S.config.feriadosOnline || {}; S.config.feriadosOnline[ano] = HOJE;
    salvar(); if (n && S.sessao.usuarioId) render();
  } catch(e) { /* sem internet: fica o cálculo local */ }
}

function diaUtilAntes(s){ let d = pd(s); while(d.getDay()===0||d.getDay()===6) d = addDias(d,-1); return iso(d); }
function blocos(meses){ const b=[]; let cur=null; [...meses].sort((a,b)=>a-b).forEach(m=>{ if(cur && m===cur[1]+1) cur[1]=m; else { cur=[m,m]; b.push(cur);} }); return b; }
function marcosExemplo(a){
  const ano = pd(a.inicio).getFullYear(), out = [];
  const mk = (t, mes, dia) => { const d = diaUtilAntes(`${ano}-${pad(mes)}-${pad(Math.min(dia, ultimoDia(ano,mes)))}`); out.push({id:uid(), titulo:t, data:d, feito: d < HOJE && hashN(a.id+t) > .12}); };
  const p = a.periodicidade;
  if (p==='Trimestral') [3,6,9,12].forEach((m,i)=>{ if(a.meses.includes(m)||a.meses.length===12) mk(`Apuração T${i+1}`, m, 31); });
  else if (p==='Semestral') [6,12].forEach((m,i)=>{ if(a.meses.includes(m)) mk(`Apuração S${i+1}`, m, 30); });
  else if (p==='Pontual') mk('Realização / entrega', Math.max(...a.meses), 15);
  else if (p==='Por edição' || p==='Por turma') blocos(a.meses).forEach((b,i)=>mk(`${p==='Por turma'?'Turma':'Edição'} ${i+1} concluída`, b[1], 25));
  return out;
}
function lancamentosExemplo(a){
  const hoje = pd(HOJE), ano = pd(a.inicio).getFullYear();
  if (pd(a.inicio) > hoje) return [];
  const ativos = a.meses.filter(m => new Date(ano, m-1, 1) <= hoje);
  const frac = Math.min(1, ativos.length / a.meses.length), r = hashN(a.titulo);
  const alvo = a.meta * frac * (frac >= 1 ? (r > .3 ? 1.05 : .72) : (.45 + r*.75));
  if (alvo <= 0) return [];
  if (a.agregacao === 'ultimo') { const m = ativos[ativos.length-1]; return [{id:uid(), data:`${ano}-${pad(m)}-${pad(Math.min(20, ultimoDia(ano,m)))}`, valor:Math.min(100, Math.round(alvo)), descricao:'Apuração do período', evidencia:'', autor:a.respId, exemplo:true}]; }
  const total = Math.max(1, Math.round(alvo)), n = Math.min(ativos.length, total, 3), out = []; let resto = total;
  for (let i=0;i<n;i++){ const m = ativos[Math.floor((i+1)*ativos.length/n) - 1]; const v = i===n-1 ? resto : Math.max(1, Math.round(total/n)); resto -= v;
    out.push({id:uid(), data:`${ano}-${pad(m)}-${pad(Math.min(18, ultimoDia(ano,m)))}`, valor:v, descricao:'Registro de execução', evidencia:'', autor:a.respId, exemplo:true}); }
  return out.filter(l=>l.valor>0);
}

  if (!d.agenda) d.agenda = [];
  d.config.ajudaOculta = d.config.ajudaOculta || {};
  d.usuarios.forEach(u=>{ if (u.foto===undefined) u.foto = null; if (!u.pin) u.pin = PIN_PADRAO; if (u.cor==='#111822') u.cor = '#2A6F8F'; });
  d.atividades.forEach(a=>{ if (a.planejada===undefined) a.planejada = true; if (!a.funcoes) a.funcoes = []; });

  d.versao = 4;

/* ================= CÁLCULOS ================= */
function diasUteisLista(a, b){
  const out = []; if (!a || !b || a > b) return out;
  const fer = new Set(S.feriados.filter(f=>f.tipo!=='Ponto facultativo').map(f=>f.data));
  let d = pd(a); const fim = pd(b);
  while (d <= fim){ const w = d.getDay(), s = iso(d); if (w!==0 && w!==6 && !fer.has(s)) out.push(s); d = addDias(d,1); }
  return out;
}
const diasUteis = (a, b) => diasUteisLista(a, b).length;
function proxDiaUtil(s, n=1){ let d = pd(s), k = 0; const fer = new Set(S.feriados.filter(f=>f.tipo!=='Ponto facultativo').map(f=>f.data)); while (k < n){ d = addDias(d,1); const w = d.getDay(); if (w!==0 && w!==6 && !fer.has(iso(d))) k++; } return iso(d); }
function segmentos(a){
  const ano = pd(a.inicio).getFullYear(), out=[];
  if (!a.meses || !a.meses.length || pd(a.fim).getFullYear() !== ano) return [[a.inicio, a.fim]];
  blocos(a.meses).forEach(([m0,m1])=>{
    let i = `${ano}-${pad(m0)}-01`, f = `${ano}-${pad(m1)}-${ultimoDia(ano,m1)}`;
    if (i < a.inicio) i = a.inicio; if (f > a.fim) f = a.fim; if (i <= f) out.push([i,f]);
  });
  return out.length ? out : [[a.inicio, a.fim]];
}
function realizadoDe(a){
  const ls = [...(a.lancamentos||[])].sort((x,y)=>x.data.localeCompare(y.data));
  if (!ls.length) return null;
  return a.agregacao === 'ultimo' ? Number(ls[ls.length-1].valor) : ls.reduce((s,l)=>s+Number(l.valor||0),0);
}
function calc(a){
  const ls = [...(a.lancamentos||[])].sort((x,y)=>x.data.localeCompare(y.data));
  const realizado = realizadoDe(a), meta = Number(a.meta)||0;
  if (a.planejada===false) return {realizado, pct:1, esperado:1, status:'extra', diasRest:0, abaixoRitmo:false, ultimo:a.fim, medida:true, uteisRest:0, uteisTot:1};
  const pct = realizado==null ? 0 : (meta>0 ? realizado/meta : 1);
  const segs = segmentos(a); let tot=0, dec=0;
  segs.forEach(([i,f])=>{ const t = difDias(i,f)+1; tot += t; if (HOJE >= f) dec += t; else if (HOJE >= i) dec += difDias(i,HOJE)+1; });
  const esperado = tot ? dec/tot : 0, diasRest = difDias(HOJE, a.fim);
  let status;
  if (a.statusManual === 'cancelada') status = 'cancelada';
  else if (a.statusManual === 'concluida' || (realizado!=null && pct >= 1)) status = 'concluida';
  else if (HOJE > a.fim) status = 'atrasada';
  else if (HOJE < a.inicio) status = 'naoiniciada';
  else if (diasRest <= S.config.diasAlerta) status = 'proximo';
  else status = 'andamento';
  return {realizado, pct, esperado, status, diasRest, abaixoRitmo: status==='andamento' && esperado > .15 && pct < esperado*0.7,
    ultimo: ls.length ? ls[ls.length-1].data : null, medida: ls.length>0,
    uteisRest: HOJE <= a.fim ? diasUteis(HOJE > a.inicio ? HOJE : a.inicio, a.fim) : 0, uteisTot: diasUteis(a.inicio, a.fim)};
}
const ST_NOME = {concluida:'Concluída', andamento:'Em andamento', proximo:'Prazo próximo', atrasada:'Atrasada', naoiniciada:'Não iniciada', cancelada:'Cancelada', extra:'Realizada (extra)'};
const ST_DESC = {concluida:'meta atingida ou marcada como concluída', andamento:'dentro do prazo', proximo:'faltam poucos dias e a meta ainda não foi atingida', atrasada:'prazo encerrado sem atingir a meta', naoiniciada:'ainda não chegou a data de início', cancelada:'não será realizada', extra:'atividade concluída que não estava no planejamento'};

function agregados(lista){
  const cs = planejadas(lista).map(a=>({a, c:calc(a)})).filter(x=>x.c.status!=='cancelada');

}

const usaPontos = a => a.unidade!=='%' && Number.isInteger(Number(a.meta)) && Number(a.meta)>=1 && Number(a.meta)<=30;
function pontosHtml(a, grandes=false, somenteLeitura=false){
  const c = calc(a), feitos = Math.max(0, Math.round(c.realizado||0)), meta = Number(a.meta);
  const lim = grandes ? meta : Math.min(meta, 15);
  if (!grandes && meta > 15) return '';
  const cor = ST_COR[c.status];
  let h = `<div class="pontos ${grandes?'grandes':''}" ${somenteLeitura?'data-ro':''} style="--cor:${cor}">`;
  if (!somenteLeitura) h += `<button class="pt zero" data-pt="${a.id}" data-v="0" title="Zerar"></button>`;
  for (let i=1;i<=lim;i++) h += `<button class="pt ${i<=feitos?'on':''}" ${somenteLeitura?'tabindex="-1"':`data-pt="${a.id}" data-v="${i}"`} title="${i} de ${meta}"></button>`;
  if (feitos > meta) h += `<span class="peq" style="font-weight:700;color:var(--ok);margin-left:4px">+${feitos-meta}</span>`;
  return h + '</div>';
}
function definirProgresso(a, v, desc, evid){
  const atual = realizadoDe(a) ?? 0; v = Number(v);
  if (isNaN(v) || v < 0) return null;
  const antes = calc(a).status;
  if (a.agregacao === 'ultimo') { if (v === atual && a.lancamentos.length) return null; a.lancamentos.push({id:uid(), data:HOJE, valor:v, descricao:desc||`Progresso atualizado para ${fmtN(v,1)}${unid(a)}`, evidencia:evid||'', autor:S.sessao.usuarioId}); }
  else { const delta = v - atual; if (!delta) return null; a.lancamentos.push({id:uid(), data:HOJE, valor:delta, descricao:desc||(delta>0?`+${fmtN(delta,1)} (total ${fmtN(v,1)})`:`Ajuste: ${fmtN(delta,1)} (total ${fmtN(v,1)})`), evidencia:evid||'', autor:S.sessao.usuarioId}); }
  const id = a.lancamentos[a.lancamentos.length-1].id;
  if (ED && ED.id===a.id) ED.lancamentos = a.lancamentos;
  salvar();
  return {id, concluiu: calc(a).status==='concluida' && antes!=='concluida'};
}

function classificar(a){
  const txt = norm(a.titulo+' '+a.kpi+' '+(a.funcoes||[]).map(nomeFuncao).join(' '));
  let melhor = null, pts = 0, achadas = [];
  BASE_TIPOS.forEach(t=>{ const h = t.chaves.filter(k=>txt.includes(k)); if (h.length > pts){ pts = h.length; melhor = t; achadas = h; } });
  return melhor ? {tipo:melhor, termos:achadas} : {tipo:BASE_GENERICA, termos:[]};
}
function dataNaFracao(ini, fim, f){
  const dias = diasUteisLista(ini, fim);
  if (!dias.length) return fim;
  return dias[Math.min(dias.length-1, Math.max(0, Math.round(f*(dias.length-1))))];
}
const parecido = (t, lista) => { const n = norm(t).slice(0,28); return lista.some(x=>norm(x).includes(n) || n.includes(norm(x).slice(0,28))); };
function inferir(a){
  const c = calc(a), fatos = [], fatores = [], sug = [], parciais = [];
  const {tipo, termos} = classificar(a);
  const tarefas = S.tarefas.filter(t=>t.atividadeId===a.id);
  const titulosExistentes = tarefas.map(t=>t.titulo);
  const recPend = (a.recursos||[]).filter(r=>['solicitado','providencia'].includes(r.status));
  const tarAtras = tarefas.filter(t=>t.status!=='feito' && t.prazo && t.prazo < HOJE);
  const abertas = tarefas.filter(t=>t.status!=='feito');
  const semReg = c.ultimo ? difDias(c.ultimo, HOJE) : (HOJE > a.inicio ? difDias(a.inicio, HOJE) : 0);
  fatos.push(`Tipo reconhecido: ${tipo.nome}${termos.length?` (termos: “${termos.join('”, “')}”)`:' (nenhum termo específico — usado o roteiro geral)'}`);
  fatos.push(`Atingido ${fmtPct(c.pct)} · esperado para hoje ${fmtPct(c.esperado)} · ${c.uteisRest} dias úteis até o prazo`);
  // ----- DIAGNÓSTICO (regras de risco)
  let pts = 0;
  const gap = c.esperado - c.pct;
  if (['concluida','extra','cancelada'].includes(c.status)) { /* sem risco */ }
  else {
    if (c.status==='atrasada') { pts += 6; fatores.push(['R1','O prazo terminou e a meta não foi atingida.']); }
    if (gap > .3) { pts += 3; fatores.push(['R2',`O andamento está ${Math.round(gap*100)} pontos abaixo do esperado para esta data.`]); }
    else if (gap > .15) { pts += 2; fatores.push(['R2',`O andamento está ${Math.round(gap*100)} pontos abaixo do esperado.`]); }
    if (c.status!=='atrasada' && c.pct < 1 && c.uteisRest <= 5) { pts += 3; fatores.push(['R3',`Restam só ${c.uteisRest} dias úteis.`]); }
    else if (c.status!=='atrasada' && c.pct < .8 && c.uteisRest <= 15) { pts += 2; fatores.push(['R3',`Restam ${c.uteisRest} dias úteis e faltam ${fmtPct(1-c.pct)} da meta.`]); }
    const recVenc = recPend.filter(r=>r.prazo && r.prazo < HOJE);
    if (recVenc.length) { pts += Math.min(3, recVenc.length*2); fatores.push(['R4',`${recVenc.length} recurso(s) necessário(s) com data vencida e ainda não providenciado(s).`]); }
    else if (recPend.length) { pts += 1; fatores.push(['R4',`${recPend.length} recurso(s) ainda pendente(s) de providência.`]); }
    if (tarAtras.length) { pts += Math.min(2, tarAtras.length); fatores.push(['R5',`${tarAtras.length} tarefa(s) atrasada(s).`]); }
    if (semReg > (S.config.diasSemRegistro||45) && c.status!=='naoiniciada') { pts += 1; fatores.push(['R6',`Sem atualização de progresso há ${semReg} dias.`]); }
    if (!abertas.length && ['andamento','proximo'].includes(c.status)) { pts += 1; fatores.push(['R7','Não há tarefas abertas planejadas para avançar esta atividade.']); }
  }
  const nivel = c.status==='atrasada' ? 'critico' : pts>=5 ? 'alto' : pts>=2 ? 'medio' : 'baixo';
  // ----- DESDOBRAMENTO (sugestões de tarefas)
  const add = (titulo, data, prio, regra, porque) => { if (!data || data > a.fim) data = a.fim; if (data < HOJE) data = proxDiaUtil(HOJE); if (!parecido(titulo, titulosExistentes) && !sug.some(s=>s.titulo===titulo)) sug.push({id:uid(), titulo, data, prioridade:prio, regra, porque}); };
  if (c.status==='concluida' || c.status==='extra' || c.status==='cancelada'){
    if (!(a.evidencia||'').trim() || !c.medida) add('Reunir e anexar as evidências do resultado', proxDiaUtil(HOJE,2), 'media', 'R10', 'A atividade está concluída; as evidências garantem o registro no relatório.');
  } else if (c.status==='atrasada'){
    add('Conversar com o gestor: replanejar prazo ou justificar o não atingimento', proxDiaUtil(HOJE,2), 'alta', 'R1', `O prazo terminou em ${fmtD(a.fim)} com ${fmtPct(c.pct)} da meta.`);
    add('Atualizar o progresso real e registrar o que foi feito', proxDiaUtil(HOJE,1), 'alta', 'R1', 'Mesmo atrasada, o realizado precisa estar registrado para o indicador.');
  } else {
    const ini = HOJE > a.inicio ? proxDiaUtil(HOJE) : a.inicio;
    let fimJanela = a.fim, origemData = 'o prazo final';
    if (tipo.usaMarco){ const m = (a.marcos||[]).filter(m=>!m.feito && m.data>=ini).sort((x,y)=>x.data.localeCompare(y.data))[0]; if (m){ fimJanela = m.data; origemData = `a etapa “${m.titulo}” (${fmtD(m.data)})`; } }
    const progresso = c.esperado; // parte do roteiro que já deveria ter passado
    tipo.passos.forEach(([t, f, p])=>{
      if (!tipo.recorrente && f < progresso - .1 && c.pct > 0) return; // etapa provavelmente já superada
      add(t, dataNaFracao(ini, fimJanela, f), p, 'R20', `Roteiro típico de “${tipo.nome}”: esta etapa acontece por volta de ${Math.round(f*100)}% do caminho até ${origemData}. Data distribuída em dias úteis, descontando feriados.`);
    });
    (tipo.depois||[]).forEach(([t, n, p])=>{ const base = n<0 ? null : fimJanela; const d = n<0 ? dataNaFracao(ini, a.fim, .97) : proxDiaUtil(base, n); add(t, d > a.fim ? a.fim : d, p, 'R21', `Fechamento típico de “${tipo.nome}”, ${n<0?'perto do prazo final':`${n} dia(s) útil(eis) após ${origemData}`}.`); });
    if (tipo.mensal){
      const mesesRest = (a.meses||[]).filter(m=>{ const fimMes = `${pd(a.fim).getFullYear()}-${pad(m)}-${ultimoDia(pd(a.fim).getFullYear(),m)}`; return fimMes >= HOJE; }).slice(0,3);
      mesesRest.forEach(m=>{ const ano = pd(a.fim).getFullYear(); let d = diaUtilAntes(`${ano}-${pad(m)}-${ultimoDia(ano,m)}`); if (feriadoEm(d)) d = diaUtilAntes(iso(addDias(pd(d),-1))); add(tipo.mensal.replace('{mes}', MESES_L[m-1]), d, 'media', 'R22', `Atividade recorrente (${a.periodicidade}): registrar mensalmente evita perder o histórico e mantém o indicador atualizado.`); });
    }
    if (tipo.trimestral){ [3,6,9,12].forEach((m,i)=>{ const ano = pd(a.fim).getFullYear(), d = diaUtilAntes(`${ano}-${pad(m)}-${ultimoDia(ano,m)}`); if (d >= HOJE && d <= a.fim){ add(`Revisão trimestral do plano (T${i+1})`, d, 'alta', 'R23', 'Planejamento é acompanhado por revisões trimestrais.'); add(`Atualizar indicadores antes da revisão T${i+1}`, iso(addDias(pd(d),-4)), 'media', 'R23', 'Os números precisam estar atualizados para a revisão.'); } }); }
    // regras de contexto
    if (gap > .15) add('Reunião rápida com o gestor para replanejar o ritmo', proxDiaUtil(HOJE,3), 'alta', 'R2', `Andamento ${Math.round(gap*100)} pontos abaixo do esperado (${fmtPct(c.pct)} contra ${fmtPct(c.esperado)}).`);
    recPend.forEach(r=>{ const d = r.prazo ? (difDias(HOJE, r.prazo) > 5 ? diasUteisLista(HOJE, r.prazo).slice(-5)[0] : proxDiaUtil(HOJE)) : proxDiaUtil(HOJE,3); add(`Confirmar com o gestor: ${r.descricao}`, d, r.prazo && r.prazo<=proxDiaUtil(HOJE,5)?'alta':'media', 'R4', `O recurso “${r.descricao}” está ${ST_REC[r.status].toLowerCase()}${r.prazo?` e é necessário até ${fmtD(r.prazo)}`:''}. Sem ele a meta fica em risco.`); });
    tarAtras.forEach(t=>add(`Destravar: ${t.titulo}`, proxDiaUtil(HOJE), 'alta', 'R5', `A tarefa “${t.titulo}” venceu ${quando(t.prazo)}. Reagende ou mova para “Aguardando” informando o motivo.`));
    if (semReg > (S.config.diasSemRegistro||45) && c.status!=='naoiniciada') add('Atualizar o progresso e anexar evidências', proxDiaUtil(HOJE), 'media', 'R6', `Último registro há ${semReg} dias; o indicador pode estar desatualizado.`);
    if ((a.evidencia||'').trim()) add(`Separar evidências: ${a.evidencia.split(/[;,]/)[0].trim()}`, dataNaFracao(ini, a.fim, .9), 'baixa', 'R24', `A evidência prevista para comprovar a meta é: ${a.evidencia}.`);
    // metas parciais
    const real = c.realizado || 0, falta = Number(a.meta) - real;
    if (a.agregacao==='soma' && falta > 0){
      const ano = pd(a.fim).getFullYear();
      const mesesRest = (a.meses||[]).filter(m=>`${ano}-${pad(m)}-${ultimoDia(ano,m)}` >= HOJE && `${ano}-${pad(m)}-01` <= a.fim);
      let acum = real;
      mesesRest.forEach((m,i)=>{ const alvo = i===mesesRest.length-1 ? Number(a.meta) : Math.ceil(real + falta*(i+1)/mesesRest.length); if (alvo <= acum) return; acum = alvo;
        let d = `${ano}-${pad(m)}-${ultimoDia(ano,m)}`; if (d > a.fim) d = a.fim; d = diaUtilAntes(d);
        parciais.push({titulo:`Meta parcial: chegar a ${fmtN(alvo,1)} de ${fmtN(a.meta,1)}`, data:d}); });
    }
  }
  sug.sort((x,y)=>x.data.localeCompare(y.data) || ({alta:0,media:1,baixa:2}[x.prioridade]-{alta:0,media:1,baixa:2}[y.prioridade]));
  return {tipo, termos, fatos, nivel, pontos:pts, fatores, sugestoes:sug, parciais};
}

function alertas(){
  const out = [], dA = S.config.diasAlerta;
  planejadas(visAtividades()).forEach(a=>{
    const c = calc(a);
    if (c.status==='atrasada') out.push({sev:'alta', tipo:'Prazo vencido', a, txt:`Encerrou em ${fmtD(a.fim)} com ${fmtPct(c.pct)} da meta (${realizadoTxt(a,c)}).`, ord:0});
    else if (c.status==='proximo') out.push({sev: c.diasRest<=7?'alta':'media', tipo:'Prazo próximo', a, txt:`Vence ${quando(a.fim)} (${c.uteisRest} dias úteis) e está em ${fmtPct(c.pct)} da meta.`, ord:1});
    else if (c.abaixoRitmo) out.push({sev:'media', tipo:'Abaixo do ritmo', a, txt:`Está em ${fmtPct(c.pct)}, mas já deveria estar perto de ${fmtPct(c.esperado)}.`, ord:3});
    if (['andamento','proximo','atrasada'].includes(c.status)) {
      const dias = difDias(c.ultimo || a.inicio, HOJE);
      if (dias > (S.config.diasSemRegistro||45)) out.push({sev:'baixa', tipo:'Progresso desatualizado', a, txt: c.ultimo ? `A última atualização foi há ${dias} dias.` : `Nenhum progresso registrado desde o início.`, ord:7});
    }
    if (c.status!=='cancelada') (a.marcos||[]).forEach(m=>{
      if (m.feito) return; const d = difDias(HOJE, m.data);
      if (d < 0) out.push({sev:'alta', tipo:'Etapa vencida', a, txt:`“${m.titulo}” era para ${fmtD(m.data)}.`, ord:2});
      else if (d <= 7) out.push({sev:'baixa', tipo:'Etapa nesta semana', a, txt:`“${m.titulo}” vence ${quando(m.data)}.`, ord:6});
    });
    (a.recursos||[]).forEach(r=>{
      if (r.status==='atendido' || r.status==='negado' || !r.prazo) return; const d = difDias(HOJE, r.prazo);
      if (d < 0) out.push({sev:'alta', tipo:'Recurso não providenciado', a, txt:`“${r.descricao}” era necessário até ${fmtD(r.prazo)}.`, ord:2});
      else if (d <= dA) out.push({sev: d<=7?'media':'baixa', tipo:'Recurso a providenciar', a, txt:`“${r.descricao}” é necessário ${quando(r.prazo)} (${ST_REC[r.status].toLowerCase()}).`, ord:4});
    });
  });
  visTarefas().filter(t=>t.status!=='feito').forEach(t=>{
    const a = atividade(t.atividadeId) || {id:'', titulo:'Tarefa avulsa', respId:t.respId};
    if (t.prazo && t.prazo < HOJE) out.push({sev:'media', tipo:'Tarefa atrasada', a, tarefa:t, txt:`“${t.titulo}” venceu ${quando(t.prazo)} (${COLUNAS.find(c=>c[0]===t.status)[1].toLowerCase()}).`, ord:5, resp:t.respId});
  });
  const pes = {alta:0, media:1, baixa:2};
  return out.sort((x,y)=>pes[x.sev]-pes[y.sev] || x.ord-y.ord);
}
function alertaHtml(al){
  const alvo = al.tarefa ? `data-tarefa="${al.tarefa.id}"` : `data-abrir="${al.a.id}"`;

}
